<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renderer bake-off</title>
<style>
  :root {
    --bg: #0b0e12; --panel: #12171e; --edge: #232b36; --ink: #e8ecf1; --muted: #8a95a6;
    --accent: #3fd7c7; --gold: #f5c85c; --bad: #ff6b81; --ok: #7be0a0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  header { padding: 18px 24px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); }
  main { padding: 8px 24px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button, .btn { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .stage { display: grid; gap: 10px; }
  .stage.side { grid-template-columns: 1fr 1fr; }
  .pane { position: relative; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--edge); }
  .pane video, .pane canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; }
  .tag.r { left: auto; right: 8px; }
  .transport { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .transport input[type=range] { flex: 1; accent-color: var(--accent); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  aside { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 14px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 3px 0; border-bottom: 1px solid #1a212b; }
  td:last-child { text-align: right; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--gold); }
  .lens { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lens canvas { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--edge); background: #000; image-rendering: pixelated; }
  .hint { color: var(--muted); font-size: 12px; }
  .big { font-size: 22px; font-weight: 600; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>渲染对照实验 · S03</h1>
  <span class="sub">左：Manim CE 0.21 渲染的 1080p60 视频　右：浏览器实时引擎（Canvas，照 Manim 源码移植）</span>
</header>
<main>
  <section>
    <div class="tabs" id="tabs">
      <button data-mode="side" class="on">并排</button>
      <button data-mode="diff">像素差异 ×4</button>
      <button data-mode="flip">A/B 快速切换</button>
      <button data-mode="engine">只看引擎（实时 + 自带配音）</button>
    </div>
    <div class="stage side" id="stage">
      <div class="pane" id="paneVideo"><video id="video" src="media/S03_manim.mp4" preload="auto" playsinline></video><span class="tag">Manim 视频</span></div>
      <div class="pane" id="paneEngine"><canvas id="engine" width="1920" height="1080"></canvas><span class="tag r" id="engineTag">浏览器引擎</span></div>
    </div>
    <div class="transport">
      <button class="btn" id="play">▶ 播放</button>
      <button class="btn" id="back">‹ 帧</button>
      <button class="btn" id="fwd">帧 ›</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span class="mono" id="clock">0.000 s · 帧 0</span>
    </div>
    <p class="hint">拖动进度条时两边同步跳转；右侧每一帧都是按时间现算出来的，不是录好的画面。把鼠标移到画面上，右栏放大镜会同时放大两边同一位置。</p>
  </section>
  <aside>
    <div class="card">
      <h2>放大镜 4×（左 Manim / 右 引擎）</h2>
      <div class="lens"><canvas id="lensA" width="240" height="240"></canvas><canvas id="lensB" width="240" height="240"></canvas></div>
    </div>
    <div class="card">
      <h2>当前帧像素差异</h2>
      <div class="big" id="diffBig">—</div>
      <div class="hint" id="diffSmall">暂停时计算全分辨率差异</div>
    </div>
    <div class="card">
      <h2>引擎性能</h2>
      <div class="mono" id="perf">—</div>
    </div>
    <div class="card">
      <h2>几何数据核对（与 Manim 导出的点坐标逐个比较）</h2>
      <table id="golden"><tr><td>计算中…</td><td></td></tr></table>
    </div>
    <div class="card">
      <h2>时间轴核对（每个动画的起止帧）</h2>
      <div class="mono" id="timeline">—</div>
    </div>
  </aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
