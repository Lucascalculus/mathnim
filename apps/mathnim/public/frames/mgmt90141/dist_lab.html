<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../kit/kit.css">
<style>
 .stage{border:1px solid var(--border);border-radius:12px;background:#fff;padding:6px 6px 2px}
 .bar{cursor:ns-resize}
 .sl{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;margin-top:10px;align-items:center;font-size:13px}
 .sl b{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
 input[type=range]{width:100%;accent-color:var(--blue)}
 .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
 .nums>div{border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--panel)}
 .nums .k{font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
 .nums .v{font:600 18px var(--sans);font-variant-numeric:tabular-nums}
 .nums .hot{border-color:var(--blue);background:#f1f5ff}.nums .bad{border-color:var(--bad);background:#fdf6f4}
 table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}
 th,td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--faint);font-variant-numeric:tabular-nums}
 th{font:600 10.5px var(--mono);color:var(--muted);background:var(--panel)}
 th:first-child,td:first-child{text-align:left}
 .halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
</style></head>
<body>
<div class="stage"><svg id="svg" viewBox="0 0 640 300" role="img"></svg></div>
<div class="sl" id="sl"></div>
<div class="nums" id="nums"></div>
<div id="tbl"></div>
<script src="../kit/kit.js"></script>
<script>
(function () {
  var K = Kit, P = K.P, t = K.t, tx = K.tx, el = K.el, h = K.h, fmt = K.fmt;
  var mode = P.mode || 'free', W = 640, H = 300, L = 46, R = 16, T = 20, B = 40, svg = document.getElementById('svg');
  var xs = P.xs ? P.xs.slice() : null, f = P.probs ? P.probs.slice() : null, n = P.n || 5, pp = P.p || 0.5, ymax = P.ymax || 0.5;
  function comb(N, k) { var r = 1; for (var i = 1; i <= k; i++) r = r * (N - k + i) / i; return r; }
  function binom() { xs = []; f = []; for (var x = 0; x <= n; x++) { xs.push(x); f.push(comb(n, x) * Math.pow(pp, x) * Math.pow(1 - pp, n - x)); } }
  if (mode === 'binomial') binom();
  var X = function (i) { return L + (i + .5) / xs.length * (W - L - R); }, bw = function () { return (W - L - R) / xs.length * .72; };
  var Y = function (v) { return H - B - v / ymax * (H - T - B); };
  var drag = null;
  if (mode === 'binomial') {
    var box = document.getElementById('sl');
    [['n', tx('trials n', '次数 n'), 1, 20, 1, function () { return n; }, function (v) { n = v; }], ['p', tx('chance p of success', '每次成功的概率 p'), 0.01, 0.99, 0.01, function () { return pp; }, function (v) { pp = v; }]].forEach(function (d) {
      h('span', '', d[1], box); var inp = h('input', '', null, box); inp.type = 'range'; inp.min = d[2]; inp.max = d[3]; inp.step = d[4]; inp.value = d[5]();
      var b = h('b', '', fmt(d[5](), 2), box); inp.oninput = function () { d[6](+inp.value); b.textContent = fmt(+inp.value, 2); binom(); draw(); };
    });
  } else {
    var nb = h('button', 'ghost', tx('Make them add to 1', '把它们调成总和为 1'), document.getElementById('sl')); nb.style.gridColumn = '1/4';
    nb.onclick = function () { var s = f.reduce(function (a, b) { return a + b; }, 0) || 1; f = f.map(function (v) { return v / s; }); draw(); };
  }
  function draw() {
    svg.innerHTML = '';
    var mu = 0, s = f.reduce(function (a, b) { return a + b; }, 0); xs.forEach(function (x, i) { mu += x * f[i]; });
    var va = 0; xs.forEach(function (x, i) { va += (x - mu) * (x - mu) * f[i]; });
    for (var v = 0; v <= ymax + 1e-9; v += ymax / 5) { el('line', { x1: L, y1: Y(v), x2: W - R, y2: Y(v), stroke: '#eef0f2' }, svg); el('text', { x: L - 6, y: Y(v) + 4, 'text-anchor': 'end', 'font-size': 12, fill: '#6b7077' }, svg, fmt(v, 2)); }
    el('line', { x1: L, y1: Y(0), x2: W - R, y2: Y(0), stroke: '#15171a', 'stroke-width': 1.6 }, svg);
    xs.forEach(function (x, i) {
      var shade = mode === 'binomial' && P.atleast && x >= 1;
      var r = el('rect', { x: X(i) - bw() / 2, y: Y(Math.min(f[i], ymax)), width: bw(), height: Math.max(1, Y(0) - Y(Math.min(f[i], ymax))), fill: shade ? '#0f766e' : '#2f5bd3', 'fill-opacity': shade ? .55 : .75, rx: 3, class: mode === 'free' ? 'bar' : '' }, svg);
      el('text', { x: X(i), y: H - B + 18, 'text-anchor': 'middle', 'font-size': 13, fill: '#15171a' }, svg, fmt(x, 0));
      if (f[i] > 0.004) el('text', { x: X(i), y: Y(Math.min(f[i], ymax)) - 5, 'text-anchor': 'middle', 'font-size': 12, fill: '#15171a', class: 'halo' }, svg, fmt(f[i], 3));
      if (mode === 'free') {
        r.setAttribute('tabindex', 0); r.setAttribute('role', 'slider'); r.setAttribute('aria-valuenow', f[i]);
        r.addEventListener('pointerdown', function (e) { drag = i; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
        r.addEventListener('keydown', function (e) { var d = e.key === 'ArrowUp' ? .01 : e.key === 'ArrowDown' ? -.01 : 0; if (d) { e.preventDefault(); f[i] = Math.max(0, f[i] + d); draw(); svg.querySelectorAll('.bar')[i].focus(); } });
      }
    });
    el('text', { x: W - R, y: H - 6, 'text-anchor': 'end', 'font-size': 12.5, 'font-weight': 600, fill: '#15171a' }, svg, P.xlabel ? t(P.xlabel) : 'x');
    // the mean is the balance point
    el('path', { d: 'M' + (L + (mu - xs[0] + .5) / xs.length * (W - L - R)) + ',' + (Y(0) + 2) + ' l-9,15 h18 z', fill: '#c2410c' }, svg);
    var nums = document.getElementById('nums'), sd = Math.sqrt(va);
    var cell = function (k, v, c) { return '<div class="' + (c || '') + '"><span class="k">' + k + '</span><div class="v">' + v + '</div></div>'; };
    nums.innerHTML = (mode === 'free' ? cell(tx('Sum of f(x)', 'f(x) 之和'), fmt(s, 3), Math.abs(s - 1) < 1e-3 ? 'hot' : 'bad') : '') + cell(tx('Mean E(x)', '期望 E(x)'), fmt(mu, 3), 'hot') + cell(tx('Variance', '方差'), fmt(va, 3), 'hot') + cell(tx('Std dev', '标准差'), fmt(sd, 3), 'hot') +
      (mode === 'binomial' ? cell('np', fmt(n * pp, 3)) + cell('np(1 − p)', fmt(n * pp * (1 - pp), 3)) + (P.atleast ? cell(tx('P(at least one)', 'P(至少一次)'), fmt(1 - f[0], 4), 'hot') : '') : '');
    if (mode === 'free') {
      var tb = '<tr><th>x</th><th>f(x)</th><th>x f(x)</th><th>(x − μ)² f(x)</th></tr>';
      xs.forEach(function (x, i) { tb += '<tr><td>' + fmt(x, 0) + '</td><td>' + fmt(f[i], 3) + '</td><td>' + fmt(x * f[i], 3) + '</td><td>' + fmt((x - mu) * (x - mu) * f[i], 3) + '</td></tr>'; });
      document.getElementById('tbl').innerHTML = '<table>' + tb + '<tr><th>' + tx('Total', '合计') + '</th><th>' + fmt(s, 3) + '</th><th>' + fmt(mu, 3) + '</th><th>' + fmt(va, 3) + '</th></tr></table>';
    }
    K.report();
  }
  svg.addEventListener('pointermove', function (e) { if (drag == null) return; var q = K.pt(svg, e), v = (H - B - q.y) / (H - T - B) * ymax; f[drag] = Math.min(ymax * 1.4, Math.max(0, Math.round(v * 100) / 100)); draw(); });
  svg.addEventListener('pointerup', function () { drag = null; }); svg.addEventListener('pointercancel', function () { drag = null; });
  draw(); K.ready();
})();
</script>
</body></html>
