<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="470" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">双编码器（检索）与交叉编码器（重排）</text><text x="30.0" y="74.0" font-size="17" fill="#2563EB" text-anchor="start" font-weight="600">双编码器</text><rect x="30.0" y="90.0" width="120.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="90.0" y="118.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">问题</text><rect x="230.0" y="90.0" width="120.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="290.0" y="118.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">文本块</text><rect x="30.0" y="160.0" width="120.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#2563EB" stroke-width="2"/><text x="90.0" y="188.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">编码器</text><rect x="230.0" y="160.0" width="120.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#2563EB" stroke-width="2"/><text x="290.0" y="188.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">编码器</text><line x1="90" y1="134" x2="90" y2="160" stroke="#86868B" stroke-width="2"/><polygon points="90,160 86.1,150.8 93.9,150.8" fill="#86868B"/><line x1="290" y1="134" x2="290" y2="160" stroke="#86868B" stroke-width="2"/><polygon points="290,160 286.1,150.8 293.9,150.8" fill="#86868B"/><rect x="30.0" y="230.0" width="120.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="90.0" y="256.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">向量</text><rect x="230.0" y="230.0" width="120.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="290.0" y="256.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">向量</text><line x1="90" y1="204" x2="90" y2="230" stroke="#86868B" stroke-width="2"/><polygon points="90,230 86.1,220.8 93.9,220.8" fill="#86868B"/><line x1="290" y1="204" x2="290" y2="230" stroke="#86868B" stroke-width="2"/><polygon points="290,230 286.1,220.8 293.9,220.8" fill="#86868B"/><rect x="130.0" y="296.0" width="120.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#B8860B" stroke-width="2"/><text x="190.0" y="322.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">余弦</text><line x1="90" y1="270" x2="165" y2="296" stroke="#86868B" stroke-width="2"/><polygon points="165,296 155.0,296.7 157.6,289.3" fill="#86868B"/><line x1="290" y1="270" x2="215" y2="296" stroke="#86868B" stroke-width="2"/><polygon points="215,296 222.4,289.3 225.0,296.7" fill="#86868B"/><text x="30.0" y="370.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="400">• 文本块的向量在索引期一次算好</text><text x="30.0" y="392.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="400">• 每个问题：编码一次 + 快速向量检索</text><text x="30.0" y="414.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="400">• 快，但抓不住细致的词级匹配</text><text x="470.0" y="74.0" font-size="17" fill="#E4572E" text-anchor="start" font-weight="600">交叉编码器</text><rect x="470.0" y="90.0" width="320.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="630.0" y="118.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">[问题] + [文本块]</text><rect x="555.0" y="160.0" width="150.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#E4572E" stroke-width="2"/><text x="630.0" y="188.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">编码器</text><line x1="630" y1="134" x2="630" y2="160" stroke="#86868B" stroke-width="2"/><polygon points="630,160 626.1,150.8 633.9,150.8" fill="#86868B"/><rect x="555.0" y="230.0" width="150.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#B8860B" stroke-width="2"/><text x="630.0" y="256.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">相关度分数</text><line x1="630" y1="204" x2="630" y2="230" stroke="#86868B" stroke-width="2"/><polygon points="630,230 626.1,220.8 633.9,220.8" fill="#86868B"/><text x="470.0" y="370.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="400">• 把问题和文本块放在一起读</text><text x="470.0" y="392.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="400">• 每一对（问题，块）都要完整跑一遍</text><text x="470.0" y="414.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="400">• 更准，但对整份语料太慢</text><text x="24.0" y="452.0" font-size="12" fill="#86868B" text-anchor="start" font-weight="400">Sentence-BERT (arXiv:1908.10084); monoBERT (arXiv:1901.04085)</text></svg>
