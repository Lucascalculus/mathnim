<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="370" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">手里有什么信号，就用什么方法</text><text x="24.0" y="72.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="600">你的情况</text><text x="400.0" y="72.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="600">信号</text><text x="580.0" y="72.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="600">方法</text><rect x="16.0" y="86.0" width="828.0" height="38.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="111.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">模型缺的是事实</text><text x="400.0" y="111.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">文档</text><text x="580.0" y="111.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">上下文：提示词 / RAG</text><rect x="16.0" y="130.0" width="828.0" height="38.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="155.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">输出只是几个固定标签之一</text><text x="400.0" y="155.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">标签</text><text x="580.0" y="155.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">编码器分类模型</text><rect x="16.0" y="174.0" width="828.0" height="38.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="199.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">能写出好的示范</text><text x="400.0" y="199.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">示范</text><text x="580.0" y="199.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">SFT（通常用 LoRA）</text><rect x="16.0" y="218.0" width="828.0" height="38.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="243.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">只能判断两个回答哪个更好</text><text x="400.0" y="243.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">比较</text><text x="580.0" y="243.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">偏好优化（DPO）</text><rect x="16.0" y="262.0" width="828.0" height="38.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="287.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">程序能判对错</text><text x="400.0" y="287.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">验证器 / 评分器</text><text x="580.0" y="287.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">RLVR、托管强化微调</text><rect x="16.0" y="306.0" width="828.0" height="38.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="331.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">已有更强的模型能做好</text><text x="400.0" y="331.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">老师</text><text x="580.0" y="331.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">蒸馏</text></svg>
