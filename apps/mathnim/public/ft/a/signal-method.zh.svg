<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="332" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">手里有什么信号，就用什么方法</text><text x="20.0" y="68.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="600">你的情况</text><text x="330.0" y="68.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="600">信号</text><text x="480.0" y="68.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="600">方法</text><rect x="12.0" y="80.0" width="696.0" height="36.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="106.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">模型缺的是事实</text><text x="330.0" y="106.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">文档</text><text x="480.0" y="106.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">上下文：提示词、RAG</text><rect x="12.0" y="120.0" width="696.0" height="36.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="146.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">输出只是几个固定标签之一</text><text x="330.0" y="146.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">标签</text><text x="480.0" y="146.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">编码器分类模型</text><rect x="12.0" y="160.0" width="696.0" height="36.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="186.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">能写出好的示范</text><text x="330.0" y="186.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">示范</text><text x="480.0" y="186.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">SFT（通常用 LoRA）</text><rect x="12.0" y="200.0" width="696.0" height="36.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="226.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">只能判断两个回答哪个更好</text><text x="330.0" y="226.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">比较</text><text x="480.0" y="226.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">偏好优化（DPO）</text><rect x="12.0" y="240.0" width="696.0" height="36.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="266.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">程序能判对错</text><text x="330.0" y="266.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">验证器</text><text x="480.0" y="266.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">RLVR、托管强化微调</text><rect x="12.0" y="280.0" width="696.0" height="36.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="306.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">已有更强的模型能做好</text><text x="330.0" y="306.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">老师</text><text x="480.0" y="306.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">蒸馏</text></svg>
