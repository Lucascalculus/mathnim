<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="400" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">改变模型行为的两个地方</text><rect x="24.0" y="60.0" width="390.0" height="230.0" rx="12" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="44.0" y="90.0" font-size="17" fill="#2563EB" text-anchor="start" font-weight="600">上下文：每次请求重新拼装</text><text x="54.0" y="124.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• 系统提示词、示例</text><text x="54.0" y="154.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• 检索到的文档（RAG）</text><text x="54.0" y="184.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• 工具定义、输出格式</text><text x="44.0" y="268.0" font-size="13" fill="#86868B" text-anchor="start" font-weight="400">只影响这一次请求 · 立刻生效 · 随时可撤回</text><rect x="446.0" y="60.0" width="390.0" height="230.0" rx="12" fill="#E4572E" fill-opacity="0.06" stroke="#E4572E" stroke-width="2"/><text x="466.0" y="90.0" font-size="17" fill="#E4572E" text-anchor="start" font-weight="600">权重：靠训练改动</text><text x="476.0" y="124.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• SFT（示范）</text><text x="476.0" y="154.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• 偏好优化（比较）</text><text x="476.0" y="184.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• 强化学习 / RLVR（奖励）</text><text x="476.0" y="214.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• 蒸馏（老师）</text><text x="466.0" y="268.0" font-size="13" fill="#86868B" text-anchor="start" font-weight="400">影响此后所有请求，包括你没测过的那些</text><rect x="60.0" y="320.0" width="180.0" height="56.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="150.0" y="354.0" 