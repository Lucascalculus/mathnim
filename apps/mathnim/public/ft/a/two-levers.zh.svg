<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="400" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">改变模型行为的两个地方</text><rect x="20.0" y="52.0" width="330.0" height="250.0" rx="12" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="36.0" y="82.0" font-size="19" fill="#2563EB" text-anchor="start" font-weight="600">上下文</text><text x="36.0" y="106.0" font-size="16" fill="#86868B" text-anchor="start" font-weight="400">每次请求重新拼装</text><text x="42.0" y="140.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• 系统提示词、示例</text><text x="42.0" y="168.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• 检索到的文档（RAG）</text><text x="42.0" y="196.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• 工具定义、输出格式</text><text x="36.0" y="262.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">只影响这一次；立刻生效；随时可撤回</text><rect x="370.0" y="52.0" width="330.0" height="250.0" rx="12" fill="#E4572E" fill-opacity="0.06" stroke="#E4572E" stroke-width="2"/><text x="386.0" y="82.0" font-size="19" fill="#E4572E" text-anchor="start" font-weight="600">权重</text><text x="386.0" y="106.0" font-size="16" fill="#86868B" text-anchor="start" font-weight="400">靠训练改动</text><text x="392.0" y="140.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• SFT（示范）</text><text x="392.0" y="168.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• 偏好优化（比较）</text><text x="392.0" y="196.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• 强化学习 / RLVR（奖励）</text><text x="392.0" y="224.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">• 蒸馏（老师）</text><text x="386.0" y="262.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">影响此后所有请求，包括你没测过的那些</text><rect x="30.0" y="330.0" width="160.0" height="50.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="110.0" y="361.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">一次请求</text><line x1="190" y1="355" x2="280" y2="355" stroke="#2563EB" stroke-width="2"/><polygon points="280,355 270.8,358.9 270.8,351.1" fill="#2563EB"/><rect x="280.0" y="330.0" width="160.0" height="50.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="360.0" y="361.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">模型</text><line x1="440" y1="355" x2="530" y2="355" stroke="#E4572E" stroke-width="2" stroke-dasharray="6 5"/><polygon points="530,355 520.8,358.9 520.8,351.1" fill="#E4572E"/><rect x="530.0" y="330.0" width="170.0" height="50.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#E4572E" stroke-width="2"/><text x="615.0" y="361.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">另一次请求</text></svg>
