<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="400" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">Two places to change what a model does</text><rect x="24.0" y="60.0" width="390.0" height="230.0" rx="12" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="2"/><text x="44.0" y="90.0" font-size="17" fill="#2563EB" text-anchor="start" font-weight="600">Context: rebuilt for every request</text><text x="54.0" y="124.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• system prompt, examples</text><text x="54.0" y="154.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• retrieved documents (RAG)</text><text x="54.0" y="184.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• tool definitions, output format</text><text x="44.0" y="268.0" font-size="13" fill="#86868B" text-anchor="start" font-weight="400">this request only · takes effect now · easy to undo</text><rect x="446.0" y="60.0" width="390.0" height="230.0" rx="12" fill="#E4572E" fill-opacity="0.06" stroke="#E4572E" stroke-width="2"/><text x="466.0" y="90.0" font-size="17" fill="#E4572E" text-anchor="start" font-weight="600">Weights: changed by training</text><text x="476.0" y="124.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• SFT (demonstrations)</text><text x="476.0" y="154.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• preference optimization (comparisons)</text><text x="476.0" y="184.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• RL / RLVR (rewards)</text><text x="476.0" y="214.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">• distillation (a teacher)</text><text x="466.0" y="268.0" font-size="13" fill="#86868B" text-anchor="start" font-weight="400">every later request, including ones you never tested</text><rect x="60.0" y="320.0" width="180.0" height="56.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="150.0" y="354.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">a request</text><line x1="240" y1="348" x2="330" y2="348" stroke="#2563EB" stroke-width="2"/><polygon points="330,348 320.8,351.9 320.8,344.1" fill="#2563EB"/><rect x="330.0" y="320.0" width="200.0" height="56.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="430.0" y="354.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">model</text><line x1="530" y1="348" x2="620" y2="348" stroke="#E4572E" stroke-width="2" stroke-dasharray="6 5"/><polygon points="620,348 610.8,351.9 610.8,344.1" fill="#E4572E"/><rect x="620.0" y="320.0" width="200.0" height="56.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#E4572E" stroke-width="2"/><text x="720.0" y="354.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">an unrelated request</text></svg>
