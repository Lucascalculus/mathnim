<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="332" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="19" fill="#111113" text-anchor="start" font-weight="600">Small models: distilling a strong teacher beat RL on the small</text><text x="20.0" y="58.0" font-size="19" fill="#111113" text-anchor="start" font-weight="600">model</text><text x="250.0" y="112.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">Qwen-32B, RL directly</text><rect x="260.0" y="98.0" width="350.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="260.0" y="98.0" width="164.5" height="20.0" rx="3" fill="#86868B" fill-opacity="1" stroke="none" stroke-width="0"/><text x="432.5" y="113.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">47.0</text><text x="250.0" y="152.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">Qwen-32B, distilled from R1</text><rect x="260.0" y="138.0" width="350.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="260.0" y="138.0" width="254.1" height="20.0" rx="3" fill="#1F8A5B" fill-opacity="1" stroke="none" stroke-width="0"/><text x="522.1" y="153.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">72.6</text><text x="250.0" y="192.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">RL (Thinking Machines)</text><rect x="260.0" y="178.0" width="350.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="260.0" y="178.0" width="236.6" height="20.0" rx="3" fill="#86868B" fill-opacity="1" stroke="none" stroke-width="0"/><text x="504.6" y="193.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">67.6</text><text x="250.0" y="232.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">on-policy distillation</text><rect x="260.0" y="218.0" width="350.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="260.0" y="218.0" width="260.4" height="20.0" rx="3" fill="#1F8A5B" fill-opacity="1" stroke="none" stroke-width="0"/><text x="528.4" y="233.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">74.4</text><text x="20.0" y="272.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">AIME 2024, pass@1. Top pair: DeepSeek-R1 (arXiv:2501.12948). Bottom pair:</text><text x="20.0" y="292.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Thinking Machines, &quot;On-policy distillation&quot; (2025); the distillation used about</text><text x="20.0" y="312.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">1/10 of the GPU hours. Separate experiments.</text></svg>
