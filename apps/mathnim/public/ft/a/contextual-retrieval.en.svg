<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 288" width="860" height="288" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="288" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">Top-20 retrieval failure rate (lower is better)</text><text x="288.0" y="86.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">embeddings only</text><rect x="300.0" y="72.0" width="440.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="300.0" y="72.0" width="385.8" height="20.0" rx="3" fill="#86868B" fill-opacity="1" stroke="none" stroke-width="0"/><text x="693.8" y="87.0" font-size="14" fill="#111113" text-anchor="start" font-weight="400">5.7%</text><text x="288.0" y="126.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">+ contextual embeddings</text><rect x="300.0" y="112.0" width="440.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="300.0" y="112.0" width="250.5" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="558.5" y="127.0" font-size="14" fill="#111113" text-anchor="start" font-weight="400">3.7%</text><text x="288.0" y="166.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">+ contextual BM25 (hybrid)</text><rect x="300.0" y="152.0" width="440.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="300.0" y="152.0" width="196.3" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="504.3" y="167.0" font-size="14" fill="#111113" text-anchor="start" font-weight="400">2.9%</text><text x="288.0" y="206.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">+ reranking</text><rect x="300.0" y="192.0" width="440.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="300.0" y="192.0" width="128.6" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="436.6" y="207.0" font-size="14" fill="#111113" text-anchor="start" font-weight="400">1.9%</text><text x="24.0" y="266.0" font-size="12" fill="#86868B" text-anchor="start" font-weight="400">Source: Anthropic, &quot;Introducing Contextual Retrieval&quot; (2024-09-19); the reranker keeps 20 of 150 candidates.</text></svg>
