<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" width="720" height="472" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="472" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">Bi-encoder (retrieve) vs cross-encoder (rerank)</text><text x="24.0" y="70.0" font-size="18" fill="#2563EB" text-anchor="start" font-weight="600">Bi-encoder</text><rect x="24.0" y="86.0" width="130.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="89.0" y="114.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">question</text><rect x="194.0" y="86.0" width="130.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="259.0" y="114.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">chunk</text><rect x="24.0" y="156.0" width="130.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#2563EB" stroke-width="2"/><text x="89.0" y="184.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">encoder</text><rect x="194.0" y="156.0" width="130.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#2563EB" stroke-width="2"/><text x="259.0" y="184.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">encoder</text><line x1="89" y1="130" x2="89" y2="156" stroke="#86868B" stroke-width="2"/><polygon points="89,156 85.1,146.8 92.9,146.8" fill="#86868B"/><line x1="259" y1="130" x2="259" y2="156" stroke="#86868B" stroke-width="2"/><polygon points="259,156 255.1,146.8 262.9,146.8" fill="#86868B"/><rect x="24.0" y="226.0" width="130.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="89.0" y="252.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">vector</text><rect x="194.0" y="226.0" width="130.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="259.0" y="252.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">vector</text><line x1="89" y1="200" x2="89" y2="226" stroke="#86868B" stroke-width="2"/><polygon points="89,226 85.1,216.8 92.9,216.8" fill="#86868B"/><line x1="259" y1="200" x2="259" y2="226" stroke="#86868B" stroke-width="2"/><polygon points="259,226 255.1,216.8 262.9,216.8" fill="#86868B"/><rect x="109.0" y="292.0" width="130.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#B8860B" stroke-width="2"/><text x="174.0" y="318.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">cosine</text><line x1="89" y1="266" x2="150" y2="292" stroke="#86868B" stroke-width="2"/><polygon points="150,292 140.0,292.0 143.1,284.8" fill="#86868B"/><line x1="259" y1="266" x2="200" y2="292" stroke="#86868B" stroke-width="2"/><polygon points="200,292 206.9,284.7 210.0,291.8" fill="#86868B"/><text x="384.0" y="70.0" font-size="18" fill="#E4572E" text-anchor="start" font-weight="600">Cross-encoder</text><rect x="384.0" y="86.0" width="312.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#86868B" stroke-width="2"/><text x="540.0" y="114.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">question + chunk</text><rect x="470.0" y="156.0" width="140.0" height="44.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#E4572E" stroke-width="2"/><text x="540.0" y="184.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">encoder</text><line x1="540" y1="130" x2="540" y2="156" stroke="#86868B" stroke-width="2"/><polygon points="540,156 536.1,146.8 543.9,146.8" fill="#86868B"/><rect x="470.0" y="226.0" width="140.0" height="40.0" rx="10" fill="#FFFFFF" fill-opacity="1" stroke="#B8860B" stroke-width="2"/><text x="540.0" y="252.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="600">score</text><line x1="540" y1="200" x2="540" y2="226" stroke="#86868B" stroke-width="2"/><polygon points="540,226 536.1,216.8 543.9,216.8" fill="#86868B"/><text x="24.0" y="362.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Chunk vectors are computed once, at</text><text x="24.0" y="382.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">indexing; a question needs one</text><text x="24.0" y="402.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">encoder pass and a fast search. Fast,</text><text x="24.0" y="422.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">but misses fine word-level matches.</text><text x="384.0" y="362.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Reads question and chunk together:</text><text x="384.0" y="382.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">one full pass per pair. More</text><text x="384.0" y="402.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">accurate, far too slow for a whole</text><text x="384.0" y="422.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">corpus.</text><text x="20.0" y="456.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Sentence-BERT (arXiv:1908.10084); monoBERT (arXiv:1901.04085)</text></svg>
