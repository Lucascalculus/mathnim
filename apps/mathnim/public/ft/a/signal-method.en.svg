<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" width="860" height="370" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="370" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">The signal you have decides the method</text><text x="24.0" y="72.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="600">your situation</text><text x="400.0" y="72.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="600">signal</text><text x="580.0" y="72.0" font-size="14" fill="#86868B" text-anchor="start" font-weight="600">method</text><rect x="16.0" y="86.0" width="828.0" height="38.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="111.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">The model lacks facts</text><text x="400.0" y="111.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">documents</text><text x="580.0" y="111.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">context: prompt / RAG</text><rect x="16.0" y="130.0" width="828.0" height="38.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="155.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">The output is one of a few fixed labels</text><text x="400.0" y="155.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">labels</text><text x="580.0" y="155.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">encoder classifier</text><rect x="16.0" y="174.0" width="828.0" height="38.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="199.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">You can write good examples</text><text x="400.0" y="199.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">demonstrations</text><text x="580.0" y="199.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">SFT (usually LoRA)</text><rect x="16.0" y="218.0" width="828.0" height="38.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="243.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">You can only say which of two is better</text><text x="400.0" y="243.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">comparisons</text><text x="580.0" y="243.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">preference optimization (DPO)</text><rect x="16.0" y="262.0" width="828.0" height="38.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="287.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">A program can check the answer</text><text x="400.0" y="287.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">verifier / grader</text><text x="580.0" y="287.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">RLVR, managed RFT</text><rect x="16.0" y="306.0" width="828.0" height="38.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="24.0" y="331.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">A stronger model already does it</text><text x="400.0" y="331.0" font-size="15" fill="#B8860B" text-anchor="start" font-weight="600">teacher</text><text x="580.0" y="331.0" font-size="15" fill="#2563EB" text-anchor="start" font-weight="600">distillation</text></svg>
