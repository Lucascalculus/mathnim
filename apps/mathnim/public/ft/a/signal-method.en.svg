<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354" width="720" height="354" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="354" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">The signal you have decides the method</text><text x="20.0" y="68.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="600">your situation</text><text x="330.0" y="68.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="600">signal</text><text x="480.0" y="68.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="600">method</text><rect x="12.0" y="80.0" width="696.0" height="36.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="106.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">The model lacks facts</text><text x="330.0" y="106.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">documents</text><text x="480.0" y="106.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">context: prompt, RAG</text><rect x="12.0" y="120.0" width="696.0" height="36.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="146.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">The output is one of a few labels</text><text x="330.0" y="146.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">labels</text><text x="480.0" y="146.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">encoder classifier</text><rect x="12.0" y="160.0" width="696.0" height="36.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="186.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">You can write good examples</text><text x="330.0" y="186.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">demonstrations</text><text x="480.0" y="186.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">SFT (usually LoRA)</text><rect x="12.0" y="200.0" width="696.0" height="58.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="226.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">You can only say which of two is</text><text x="20.0" y="248.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">better</text><text x="330.0" y="226.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">comparisons</text><text x="480.0" y="226.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">preference optimization</text><rect x="12.0" y="262.0" width="696.0" height="36.0" rx="6" fill="#E6E6EA" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="288.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">A program can check the answer</text><text x="330.0" y="288.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">verifier</text><text x="480.0" y="288.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">RLVR, managed RFT</text><rect x="12.0" y="302.0" width="696.0" height="36.0" rx="6" fill="#FFFFFF" fill-opacity="0.6" stroke="none" stroke-width="0"/><text x="20.0" y="328.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">A stronger model already does it</text><text x="330.0" y="328.0" font-size="16" fill="#B8860B" text-anchor="start" font-weight="600">teacher</text><text x="480.0" y="328.0" font-size="16" fill="#2563EB" text-anchor="start" font-weight="600">distillation</text></svg>
