<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 422" width="720" height="422" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="422" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="19" fill="#111113" text-anchor="start" font-weight="600">相关段落放在长上下文的什么位置，会影响答对率</text><line x1="100" y1="270" x2="690" y2="270" stroke="#86868B" stroke-width="2"/><line x1="100" y1="270" x2="100" y2="70" stroke="#86868B" stroke-width="2"/><polyline points="120.0,90.0 133.8,97.1 147.5,103.8 161.2,110.2 175.0,116.2 188.8,121.9 202.5,127.2 216.2,132.2 230.0,136.8 243.8,141.1 257.5,145.0 271.2,148.6 285.0,151.8 298.8,154.7 312.5,157.2 326.2,159.4 340.0,161.2 353.8,162.7 367.5,163.8 381.2,164.6 395.0,165.0 408.8,165.1 422.5,164.8 436.2,164.2 450.0,163.2 463.8,161.9 477.5,160.2 491.2,158.2 505.0,155.8 518.8,153.1 532.5,150.0 546.2,146.6 560.0,142.8 573.8,138.7 587.5,134.2 601.2,129.4 615.0,124.2 628.8,118.7 642.5,112.8 656.2,106.6 670.0,100.0" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 6"/><text x="120.0" y="294.0" font-size="15" fill="#86868B" text-anchor="middle" font-weight="400">最前</text><text x="670.0" y="294.0" font-size="15" fill="#86868B" text-anchor="middle" font-weight="400">最后</text><text x="395.0" y="320.0" font-size="16" fill="#111113" text-anchor="middle" font-weight="400">相关段落在检索结果中的位置</text><text x="88.0" y="170.0" font-size="16" fill="#111113" text-anchor="end" font-weight="400">答对率</text><text x="20.0" y="352.0" font-size="16" fill="#111113" text-anchor="start" font-weight="400">只示意形状：放在开头和结尾时答对率最高，放在中间最低。</text><text x="20.0" y="378.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">形状依据 Liu et al.《Lost in the</text><text x="20.0" y="398.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Middle》（TACL，arXiv:2307.03172），不是论文里的数字。</text></svg>
