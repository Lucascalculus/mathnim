<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="860" height="420" fill="#FFFFFF"/><text x="24.0" y="36.0" font-size="20" fill="#111113" text-anchor="start" font-weight="600">相关段落放在长上下文的什么位置，会影响答对率</text><line x1="110" y1="300" x2="780" y2="300" stroke="#86868B" stroke-width="2"/><line x1="110" y1="300" x2="110" y2="80" stroke="#86868B" stroke-width="2"/><polyline points="130.0,102.0 145.8,109.8 161.5,117.2 177.2,124.2 193.0,130.8 208.8,137.1 224.5,142.9 240.2,148.4 256.0,153.5 271.8,158.2 287.5,162.5 303.2,166.4 319.0,170.0 334.8,173.1 350.5,175.9 366.2,178.3 382.0,180.3 397.8,181.9 413.5,183.2 429.2,184.0 445.0,184.5 460.8,184.6 476.5,184.3 492.2,183.6 508.0,182.5 523.8,181.1 539.5,179.2 555.2,177.0 571.0,174.4 586.8,171.4 602.5,168.0 618.2,164.2 634.0,160.1 649.8,155.5 665.5,150.6 681.2,145.3 697.0,139.6 712.8,133.5 728.5,127.1 744.2,120.2 760.0,113.0" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="10 6"/><text x="130.0" y="324.0" font-size="14" fill="#86868B" text-anchor="middle" font-weight="400">最前</text><text x="760.0" y="324.0" font-size="14" fill="#86868B" text-anchor="middle" font-weight="400">最后</text><text x="445.0" y="348.0" font-size="15" fill="#111113" text-anchor="middle" font-weight="400">相关段落在检索结果中的位置</text><text x="96.0" y="190.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">答对率</text><text x="24.0" y="382.0" font-size="14" fill="#111113" text-anchor="start" font-weight="400">只示意形状：放在开头和结尾时答对率最高，放在中间最低。</text><text x="24.0" y="406.0" font-size="12" fill="#86868B" text-anchor="start" font-weight="400">形状依据 Liu et al.《Lost in the Middle》，TACL（arXiv:2307.03172）；不是论文里的数字。</text></svg>
