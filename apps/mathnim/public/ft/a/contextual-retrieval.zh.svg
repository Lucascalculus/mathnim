<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 286" width="720" height="286" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="286" fill="#FFFFFF"/><text x="20.0" y="32.0" font-size="19" fill="#111113" text-anchor="start" font-weight="600">前 20 块的检索失败率（越低越好）</text><text x="220.0" y="86.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">只用向量</text><rect x="230.0" y="72.0" width="380.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="230.0" y="72.0" width="333.2" height="20.0" rx="3" fill="#86868B" fill-opacity="1" stroke="none" stroke-width="0"/><text x="571.2" y="87.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">5.7%</text><text x="220.0" y="126.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">+ 上下文化向量</text><rect x="230.0" y="112.0" width="380.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="230.0" y="112.0" width="216.3" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="454.3" y="127.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">3.7%</text><text x="220.0" y="166.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">+ 上下文化 BM25</text><rect x="230.0" y="152.0" width="380.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="230.0" y="152.0" width="169.5" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="407.5" y="167.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">2.9%</text><text x="220.0" y="206.0" font-size="15" fill="#111113" text-anchor="end" font-weight="400">+ 重排</text><rect x="230.0" y="192.0" width="380.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="230.0" y="192.0" width="111.1" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="349.1" y="207.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">1.9%</text><text x="20.0" y="246.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">来源：Anthropic《Introducing Contextual Retrieval》（2024-09-19）；重排时从 150 个候</text><text x="20.0" y="266.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">选里留 20 个。</text></svg>
