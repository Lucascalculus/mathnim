t="400">DPO (trl + dpo)</text><rect x="210.0" y="218.0" width="400.0" height="20.0" rx="3" fill="#E6E6EA" fill-opacity="1" stroke="none" stroke-width="0"/><rect x="210.0" y="218.0" width="49.6" height="20.0" rx="3" fill="#2563EB" fill-opacity="1" stroke="none" stroke-width="0"/><text x="267.6" y="233.0" font-size="15" fill="#111113" text-anchor="start" font-weight="400">10,532</text><text x="20.0" y="272.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Counts of models carrying the tag the training tool adds; they undercount and</text><text x="20.0" y="292.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">lean towards hobbyist uploads. &quot;Text classification&quot;: models trained with the</text><text x="20.0" y="312.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">Trainer. Source: research-adoption.md.</text></svg>
