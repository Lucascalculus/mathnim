"#86868B" text-anchor="start" font-weight="400">由 docs/lessons/mpc/m5/bench.py 在一台 Apple M4 笔记本上测得（Python 3.12；OSQP</text><text x="20.0" y="540.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">1.1.1，默认精度 1e-3；Clarabel 0.11.1）：课程里的小车从静止出发靠墙停车，闭环跑 90 个采</text><text x="20.0" y="560.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">样。圆点：第 1–89 个采样的中位数；竖线：一直到最慢的那个采样。热启动：从上一个计划平移一步</text><text x="20.0" y="580.0" font-size="15" fill="#86868B" text-anchor="start" font-weight="400">出发。稠密形式的内点法在 N &gt; 160 时没有跑。换一台机器数字会变，能带走的是斜率。</text></svg>
