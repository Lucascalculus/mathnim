<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Georgia, 'Times New Roman', serif" role="img" aria-labelledby="t">
  <title id="t">h = W0 x + B A x: a frozen d×k matrix W0 beside a trainable path through B (d×r) and A (r×k)</title>
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- input x -->
  <line x1="320" y1="300" x2="320" y2="270" stroke="#111113" stroke-width="2"/>
  <line x1="320" y1="270" x2="170" y2="270" stroke="#111113" stroke-width="2"/>
  <line x1="320" y1="270" x2="470" y2="270" stroke="#111113" stroke-width="2"/>
  <line x1="170" y1="270" x2="170" y2="240" stroke="#111113" stroke-width="2"/>
  <line x1="470" y1="270" x2="470" y2="252" stroke="#111113" stroke-width="2"/>
  <text x="320" y="322" text-anchor="middle" font-size="20" font-style="italic" fill="#111113">x</text>
  <!-- frozen W0: a big square -->
  <rect x="80" y="70" width="180" height="170" rx="8" fill="#E6E6EA" stroke="#86868B" stroke-width="2"/>
  <text x="170" y="150" text-anchor="middle" font-size="30" font-style="italic" fill="#111113">W<tspan font-size="18" dy="7">0</tspan></text>
  <text x="170" y="186" text-anchor="middle" font-size="16" fill="#86868B">d × k</text>
  <text x="170" y="214" text-anchor="middle" font-size="22" fill="#86868B">❄</text>
  <!-- trainable A (r x k): wide and short -->
  <rect x="390" y="212" width="160" height="40" rx="6" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="239" text-anchor="middle" font-size="22" font-style="italic" fill="#2563EB">A</text>
  <text x="566" y="238" font-size="15" fill="#2563EB">r × k</text>
  <!-- r-wide bottleneck -->
  <line x1="470" y1="212" x2="470" y2="190" stroke="#2563EB" stroke-width="2"/>
  <!-- trainable B (d x r): tall and thin -->
  <rect x="450" y="70" width="40" height="120" rx="6" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="2"/>
  <text x="470" y="137" text-anchor="middle" font-size="22" font-style="italic" fill="#2563EB">B</text>
  <text x="502" y="120" font-size="15" fill="#2563EB">d × r</text>
  <!-- outputs meet at + -->
  <line x1="170" y1="70" x2="170" y2="40" stroke="#111113" stroke-width="2"/>
  <line x1="470" y1="70" x2="470" y2="40" stroke="#111113" stroke-width="2"/>
  <line x1="170" y1="40" x2="303" y2="40" stroke="#111113" stroke-width="2"/>
  <line x1="470" y1="40" x2="337" y2="40" stroke="#111113" stroke-width="2"/>
  <circle cx="320" cy="40" r="17" fill="#ffffff" stroke="#111113" stroke-width="2"/>
  <text x="320" y="47" text-anchor="middle" font-size="22" fill="#111113">+</text>
  <text x="320" y="16" text-anchor="middle" font-size="20" font-style="italic" fill="#111113">h</text>
</svg>
