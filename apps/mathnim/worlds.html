<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mathium · lesson worlds</title>
<style>
  body{margin:0;background:#FBFBFA;color:#15171a;font:14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  header{padding:22px 32px 6px}
  h1{font-size:18px;margin:0 0 4px}
  .muted{color:#6b7077;font-size:12.5px}
  main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 36px;padding:18px 32px 60px}
  .w{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .w h2{grid-column:1/3;font-size:13px;font-weight:600;margin:0;font-family:ui-monospace,Menlo,monospace}
  canvas{width:100%;aspect-ratio:16/9;display:block;border:1px solid rgba(26,27,31,.1);border-radius:10px;background:#FBFBFA}
</style>
</head>
<body>
<!-- The lessons' worlds (src/worlds/<course>/<lesson>.ts), each from straight above (as at rest) and in the world (as
     when the hand is on its card): a sheet to look at them all. Dev only (not built): /worlds.html?c=mpc&lang=zh -->
<header><h1>Lesson worlds</h1><div class="muted" id="n"></div></header>
<main id="m"></main>
<script type="module">
import { world_ids, load_world } from '/src/lesson_worlds.ts';
import { setup } from '/src/course_worlds.js';
const q = new URLSearchParams(location.search), course = q.get('c') ?? '', lang = q.get('lang') ?? 'en';
const ids = world_ids().filter((id) => !course || id.startsWith(course));
document.getElementById('n').textContent = `${ids.length} lessons · ${lang}`;
const m = document.getElementById('m');
for (const id of ids) {
  const box = document.createElement('section'); box.className = 'w';
  box.innerHTML = `<h2>${id}</h2><canvas></canvas><canvas></canvas>`;
  m.append(box);
  const wd = await load_world(id);
  requestAnimationFrame(() => box.querySelectorAll('canvas').forEach((cv, i) => {
    const r = cv.getBoundingClientRect(), w = Math.round(r.width), h = Math.round(r.height), ctx = setup(cv, w, h);
    cv.style.width = ''; cv.style.height = '';
    wd.draw(ctx, w, h, { top: i === 0 ? 1 : 0, lang });
  }));
}
</script>
</body>
</html>
