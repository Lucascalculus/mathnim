<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathnim · 路线</title>
<link rel="stylesheet" href="base.css">
<style>
/* 路线 (Route): a course is a walk. Its line is as long as its time (Beck: keep what the learner's question needs:
   where am I, what's next, how much is left); units are districts and the two ends say what to bring and what you
   will be able to do (Lynch, the Salk line). Inside a lesson the same line continues as the steps: the past dims,
   the present is lit, the next step shows a corner (留园, Cullen's serial vision, Mela's cooking mode). */
:root { --w: 1200px; --side: 48px; }
.wrap { max-width: calc(var(--w) + 2 * var(--side)); margin: 0 auto; padding: 0 var(--side); }
.bar { height: 64px; display: flex; align-items: center; }
.bar .logo { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.bar .logo svg { width: 22px; height: 22px; }
.bar nav { margin-left: auto; display: flex; gap: 22px; align-items: center; font-size: 13.5px; color: var(--muted); }
.bar nav a:hover { color: var(--ink); }
.me { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px var(--ink); display: grid; place-items: center; font: 600 13px/1 var(--serif); }

/* ---------------------------------------------------------------- home */
.here { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--s8); align-items: center; padding: var(--s7) 0 var(--s9); }
.here .where { color: var(--muted); }
.here .where b { color: var(--accent); font-weight: 500; }
.here h1 { font-size: 48px; line-height: 1.1; letter-spacing: -.035em; font-weight: 700; margin: var(--s4) 0 var(--s6); text-wrap: balance; }
.here .local { display: block; width: 100%; max-width: 460px; height: 40px; overflow: visible; }
.here .go { margin-top: var(--s6); display: flex; align-items: center; gap: var(--s4); }
.here .go .mono { color: var(--muted); }
.here .plate { opacity: .96; }

.atlas { border-top: 1px solid var(--ink); padding: var(--s4) 0 var(--s10); }
.atlas .head { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: var(--s6); }
.line-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); column-gap: var(--s6); padding: var(--s5) 0 var(--s4); border-top: 1px solid var(--hair); }
.line-row:first-of-type { border-top: 0; }
.line-row .name { display: grid; gap: 6px; align-content: start; }
.line-row .name b { font-size: 16px; font-weight: 650; letter-spacing: -.01em; line-height: 1.35; }
.line-row .name .mono { color: var(--muted); }
.line-row:hover .name b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.line-row svg { display: block; overflow: visible; }
.line-row svg text { font: 500 10.5px var(--mono); letter-spacing: .06em; }
.scale { display: flex; align-items: center; gap: 10px; color: var(--muted); margin: var(--s5) 0 0 calc(200px + var(--s6) + 18px); }
.scale i { display: block; height: 7px; border: 1.25px solid var(--muted); border-top: 0; }

.st { cursor: pointer; }
.plate-tip { position: absolute; z-index: 20; width: 240px; background: var(--white); padding: 8px 8px 10px; box-shadow: var(--lift-hi); border-radius: 2px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform var(--d-snappy) var(--snappy); }
.plate-tip.on { opacity: 1; transform: none; }
.plate-tip .t { font-size: 13.5px; font-weight: 600; line-height: 1.4; margin-top: 9px; }
.plate-tip .mono { color: var(--muted); margin-top: 4px; }

/* ---------------------------------------------------------------- course: the walk, top to bottom */
.c-head { padding: var(--s7) 0 var(--s7); max-width: 820px; }
.c-head .back { color: var(--muted); }
.c-head h1 { font-size: var(--t-course); line-height: 1; letter-spacing: -.045em; margin: var(--s5) 0 var(--s5); font-weight: 700; }
.c-head p { margin: 0; color: var(--ink2); font-size: 18px; line-height: 1.7; }
.c-head .go { margin-top: var(--s6); }
.walk { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--s8); align-items: start; padding-bottom: var(--s10); }
.route { position: relative; --x: 76px; }
.route::before { content: ''; position: absolute; left: var(--x); top: 10px; bottom: 10px; width: 3px; margin-left: -1.5px; background: var(--accent); opacity: .22; border-radius: 2px; }
.route .done-line { position: absolute; left: var(--x); top: 10px; width: 3px; margin-left: -1.5px; background: var(--accent); border-radius: 2px; }
.end { position: relative; display: grid; grid-template-columns: var(--x) 1fr; padding: 0 0 var(--s7); }
.end .dot { position: absolute; left: var(--x); top: 3px; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--accent); z-index: 1; }
.end.fin .dot { top: calc(var(--s6) + 3px); }
.end .k { grid-column: 2; }
.end .k { padding-left: var(--s6); }
.end .k .mono { color: var(--accent); }
.end .k p { margin: 8px 0 0; color: var(--ink2); font-size: 15px; line-height: 1.7; max-width: 36em; }
.end .k ol { margin: 10px 0 0; padding: 0; list-style: none; counter-reset: o; max-width: 40em; }
.end .k ol li { counter-increment: o; display: grid; grid-template-columns: 28px 1fr; font-size: 15.5px; line-height: 1.65; padding: 6px 0; }
.end .k ol li::before { content: counter(o, decimal-leading-zero); font: 500 11.5px/2.2 var(--mono); color: var(--accent); }
.end .k .links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.end .k .links a { color: var(--ink2); text-decoration: underline; text-decoration-color: var(--hair2); text-underline-offset: 3px; }
.end.fin { padding: var(--s6) 0 0; }
.district { position: relative; display: grid; grid-template-columns: var(--x) 1fr; align-items: baseline; padding: var(--s5) 0 var(--s4); }
.district .n { justify-self: end; padding-right: 22px; color: var(--muted); }
.district h2 { grid-column: 2; margin: 0; padding-left: var(--s6); font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.district h2 small { font: 500 11px/1 var(--mono); letter-spacing: .07em; color: var(--muted); margin-left: 12px; font-weight: 500; }
.stop { position: relative; display: grid; grid-template-columns: var(--x) 200px minmax(0, 1fr); align-items: start; min-height: calc(var(--m) * 5px); padding-bottom: var(--s5); }
.stop .t0 { justify-self: start; color: var(--faint); padding-top: 4px; }
.stop .dot { position: absolute; left: var(--x); top: 6px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 2px var(--accent); z-index: 1; }
.stop.done .dot { background: var(--accent); }
.stop.current .dot { width: 19px; height: 19px; margin-left: -9.5px; top: 3px; box-shadow: inset 0 0 0 3px var(--accent), 0 0 0 5px var(--paper), 0 0 0 6.5px var(--accent); }
.stop .plate { margin-left: var(--s6); }
.stop.new .plate { opacity: .82; }
.stop .txt { padding-left: var(--s5); }
.stop .txt .mono { color: var(--muted); }
.stop .txt .mono .ok { color: var(--accent); }
.stop .txt b { display: block; font-size: 17px; font-weight: 650; letter-spacing: -.01em; line-height: 1.35; margin: 6px 0 6px; }
.stop .txt p { margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.65; max-width: 40em; }
.stop .txt .resume { margin-top: 12px; }
.stop:hover .txt b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
/* the overview that travels with you: the whole course, small, with where the page is */
.mini { position: sticky; top: 32px; }
.mini .mono { color: var(--muted); }
.mini svg { display: block; overflow: visible; margin-top: var(--s4); }
.mini svg text { font: 500 10.5px var(--mono); letter-spacing: .05em; fill: var(--muted); }
.mini svg .u { cursor: pointer; }
.mini svg .u:hover text { fill: var(--ink); }

/* ---------------------------------------------------------------- lesson: the walk continues */
.l-bar { height: 56px; display: flex; align-items: center; gap: var(--s4); }
.l-bar .crs { color: var(--muted); font-size: 13.5px; }
.l-bar .crs:hover { color: var(--ink); }
.l-bar .sl { color: var(--hair2); }
.l-bar h1 { margin: 0; font-size: 15px; font-weight: 600; }
.l-bar nav { margin-left: auto; display: flex; gap: 20px; font-size: 13.5px; color: var(--muted); align-items: center; }
.room { display: grid; grid-template-columns: 236px minmax(0, 1fr) 260px; gap: var(--s7); padding: var(--s6) 0 var(--s10); align-items: start; }
.room .main { min-width: 0; }
.room.text .main { max-width: 640px; }
.rail { position: sticky; top: 24px; }
.rail ol { margin: 0; padding: 0; list-style: none; position: relative; }
.rail ol::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1.5px; background: var(--hair2); }
.rail li { position: relative; display: grid; grid-template-columns: 16px 1fr; gap: 12px; padding: 5px 0; cursor: pointer; font-size: 13px; line-height: 1.45; color: var(--faint); transition: color .2s; }
.rail li svg { width: 16px; height: 16px; overflow: visible; margin-top: 1px; background: var(--paper); }
.rail li.done { color: var(--muted); }
.rail li.here { color: var(--ink); font-weight: 600; font-size: 14px; }
.rail li.here .k { color: var(--accent); }
.rail li .k { display: block; font: 500 10px/1.6 var(--mono); letter-spacing: .07em; color: var(--faint); font-weight: 500; }
.rail li:hover { color: var(--ink2); }
.rail .done-line { position: absolute; left: 7px; top: 8px; width: 1.5px; background: var(--ink); }
.prev { color: var(--faint); font-size: 14px; margin-bottom: var(--s5); display: flex; gap: 10px; align-items: center; }
.prev .mono { color: var(--faint); }
.step-h { margin: 0 0 var(--s5); }
.step-h .mono { color: var(--accent); }
.step-h h2 { margin: 8px 0 0; font-size: var(--t-step); line-height: 1.25; letter-spacing: -.02em; font-weight: 650; }
.figure .plate.full { box-shadow: 0 0 0 1px var(--hair), var(--lift); }
.figure .aside { margin-top: 12px; color: var(--muted); font-size: 12.5px; }
.player { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: var(--s4); align-items: center; margin-top: var(--s5); }
.player .pp { width: 44px; height: 44px; border-radius: 22px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.player .pp svg { width: 14px; height: 14px; }
.player .segs { display: flex; gap: 4px; height: 20px; align-items: center; }
.player .segs i { flex: 1; height: 3px; background: var(--hair2); position: relative; border-radius: 2px; overflow: hidden; }
.player .segs i b { position: absolute; inset: 0; width: var(--p, 0%); background: var(--ink); }
.player .mono { color: var(--muted); }
.say { margin-top: var(--s5); font-size: 19px; line-height: 1.75; max-width: 40em; }
.read p { font-size: var(--t-body); line-height: 1.8; margin: 0 0 var(--s5); color: #202328; }
.read p b { font-weight: 650; }
.read sup { font: 600 10.5px/1 var(--mono); color: var(--accent); margin-left: 2px; }
.read .aside-note { border-left: 2px solid var(--ink); padding: 2px 0 2px var(--s5); margin: var(--s6) 0; color: var(--ink2); font-size: 15.5px; line-height: 1.75; }
.quiz .q { font-size: 20px; line-height: 1.7; margin-bottom: var(--s6); }
.quiz .opt { display: grid; grid-template-columns: 32px 1fr auto; gap: var(--s3); align-items: center; width: 100%; text-align: left; padding: 14px 4px; border-top: 1px solid var(--hair); font-size: 16.5px; line-height: 1.6; }
.quiz .opt:last-of-type { border-bottom: 1px solid var(--hair); }
.quiz .opt .mono { color: var(--muted); }
.quiz .opt:hover { background: var(--wash); }
.quiz .opt.right { color: var(--accent); }
.quiz .opt.right .mono { color: var(--accent); }
.quiz .opt.wrong { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--hair2); }
.quiz .verdict { font: 500 11px/1 var(--mono); letter-spacing: .06em; }
.quiz .why { margin-top: var(--s5); font-size: 17px; line-height: 1.8; }
/* the next step shows a corner: its title, faint, below the continue */
.ahead { margin-top: var(--s7); display: grid; grid-template-columns: auto 1fr; gap: var(--s5); align-items: center; }
.ahead .peek { color: var(--faint); font-size: 14px; line-height: 1.5; }
.ahead .peek .mono { display: block; color: var(--faint); }
.margin { position: relative; }
.ask { position: sticky; top: 24px; }
.ask > .mono { color: var(--muted); }
.ask .q { display: block; margin-top: 14px; font-size: 14px; line-height: 1.55; color: var(--muted); padding-left: 16px; position: relative; cursor: pointer; }
.ask .q::before { content: ''; position: absolute; left: 0; top: .78em; width: 8px; height: 1.25px; background: currentColor; }
.ask .q:hover { color: var(--ink); }
.ask .line { margin-top: 22px; border-bottom: 1.25px solid var(--ink2); height: 34px; font: 15px/34px var(--serif); color: var(--faint); }
.note { position: absolute; left: 0; right: 0; }
.note .mono { color: var(--accent); }
.note .q { font-size: 14px; font-weight: 600; line-height: 1.55; margin: 8px 0 6px; }
.note .a { font: 15.5px/1.75 var(--serif); color: var(--ink2); }
.leader { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.phone-at { display: none; }
.dock { display: none; }

@media (max-width: 1180px) {
  :root { --side: 28px; }
  .room { grid-template-columns: 200px minmax(0, 1fr); }
  .margin { display: none; }
  .walk { grid-template-columns: minmax(0, 1fr); }
  .mini { display: none; }
}
@media (max-width: 700px) {
  :root { --side: 20px; --t-course: 44px; --t-step: 24px; }
  .bar nav a { display: none; }
  .here { grid-template-columns: 1fr; gap: var(--s6); padding-top: var(--s4); }
  .here h1 { font-size: 32px; }
  .line-row { grid-template-columns: 1fr; row-gap: var(--s3); }
  .scale { margin-left: 18px; }
  .route { --x: 22px; }
  .stop { grid-template-columns: var(--x) minmax(0, 1fr); min-height: 0; }
  .stop .t0 { display: none; }
  .stop .plate { grid-column: 2; margin-left: var(--s5); max-width: 260px; }
  .stop .txt { grid-column: 2; padding-left: var(--s5); margin-top: var(--s3); }
  .district .n { display: none; }
  .district h2, .end .k { padding-left: var(--s5); }
  .room { grid-template-columns: 1fr; }
  .rail { display: none; }
  .l-bar h1, .l-bar .sl, .l-bar nav a { display: none; }
  .phone-at { display: block; margin: 0 0 var(--s5); }
  .phone-at .mono { color: var(--muted); }
  .phone-at svg { display: block; width: 100%; height: 14px; margin-top: 8px; overflow: visible; }
  .figure { margin: 0 calc(-1 * var(--side)); }
  .figure .crops { display: none; }
  .figure .aside, .figure .player, .figure .say { margin-left: var(--side); margin-right: var(--side); }
  .read p { font-size: 17px; }
  .ahead .btn { display: none; }
  .dock { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40; gap: 8px; padding: 8px; background: var(--white); border-radius: var(--r-panel); box-shadow: var(--lift-hi); }
  .dock .btn { border-radius: var(--r-inner); }
  .dock .btn.primary { flex: 1; justify-content: center; }
  .room { padding-bottom: 120px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
const { courses, lesson, course, all, current, recent, unit_of, esc, hours, pad, plate, kind_mark, KIND, ARROW, LOGO } = UI;
const bar = () => `<header class="wrap bar"><a class="logo" href="#/">${LOGO}Mathnim</a><nav><a href="#">数据</a><a href="#">设置</a><span class="me">L</span></nav></header>`;
const accent = (c) => document.documentElement.style.setProperty('--accent', c.accent);

/**
 * A course as one line that wraps across `W`: length is time (k px a minute), units a gap apart. Stations carry their
 * positions; `path` draws the line between two distances, rows joined by a half-turn.
 */
function layout(c, W, k, rowGap, unitGap = 10) {
  const stations = [];
  let s = 0;
  c.units.forEach((u, ui) => {
    if (ui) s += unitGap;
    u.lessons.forEach((l, li) => {
      stations.push({ l, s, unit: ui, first: li === 0, u });
      s += (l.minutes || 15) * k;
    });
  });
  const L = s, rows = Math.max(1, Math.ceil(L / W - 1e-9));
  const at = (d) => {
    const r = Math.min(Math.floor(d / W), rows - 1), t = d - r * W;
    return { x: r % 2 ? W - t : t, y: r * rowGap, r };
  };
  const path = (a, b) => {
    let d = '';
    for (let r = Math.floor(a / W); r < rows && r * W < b; r++) {
      const s0 = Math.max(a, r * W), s1 = Math.min(b, (r + 1) * W);
      const p0 = at(s0), p1 = at(Math.min(s1, (r + 1) * W - 1e-6));
      d += `M${p0.x.toFixed(1)},${p0.y}L${p1.x.toFixed(1)},${p1.y}`;
      if (s1 >= (r + 1) * W && r < rows - 1 && b > (r + 1) * W) {
        const ex = r % 2 ? 0 : W, sweep = r % 2 ? 0 : 1;
        d += `M${ex},${r * rowGap}A${rowGap / 2},${rowGap / 2} 0 0 ${sweep} ${ex},${(r + 1) * rowGap}`;
      }
    }
    return d;
  };
  stations.forEach((st) => Object.assign(st, at(st.s)));
  return { stations, L, rows, at, path };
}
function draw_line(c, R, { r = 4, width = 3, labels = true } = {}) {
  const cur = R.stations.find((x) => x.l.status === 'current');
  const doneTo = cur ? cur.s : R.stations.some((x) => x.l.status === 'done') ? R.L : 0;
  let g = `<path d="${R.path(0, R.L)}" fill="none" stroke="${c.accent}" stroke-opacity=".2" stroke-width="${width}" stroke-linecap="round"/>`;
  if (doneTo) g += `<path d="${R.path(0, doneTo)}" fill="none" stroke="${c.accent}" stroke-width="${width}" stroke-linecap="round"/>`;
  const end = R.at(R.L);
  g += `<path d="M${end.x},${end.y - 6}v12" stroke="${c.accent}" stroke-width="${width}" stroke-opacity="${doneTo ? 1 : .4}"/>`;
  R.stations.forEach((st, i) => {
    const s = st.l.status;
    const dot = s === 'current'
      ? `<circle cx="${st.x}" cy="${st.y}" r="${r + 2.5}" fill="var(--paper)" stroke="${c.accent}" stroke-width="2.5"/><circle cx="${st.x}" cy="${st.y}" r="${r + 7}" fill="none" stroke="${c.accent}" stroke-width="1" stroke-opacity=".6"/>`
      : `<circle cx="${st.x}" cy="${st.y}" r="${r}" fill="${s === 'done' ? c.accent : 'var(--paper)'}" stroke="${c.accent}" stroke-width="1.75" ${s === 'new' ? 'stroke-opacity=".5"' : ''}/>`;
    g += `<g class="st" data-c="${c.id}" data-i="${i}">${dot}<circle cx="${st.x}" cy="${st.y}" r="11" fill="transparent"/></g>`;
    // districts: each unit's name above where it starts, on the first row, only where it fits before the next one
    if (labels && st.first && st.r === 0) {
      const nextFirst = R.stations.find((o) => o.first && o.s > st.s), room = (nextFirst && nextFirst.r === 0 ? nextFirst.x : R.at(Math.min(R.L, (st.r + 1) * 1e9)).x + 1e9) - st.x - 14;
      const t = st.u.title, fit = Math.floor(room / 11.5);
      if (fit >= 2) g += `<text x="${st.x}" y="${st.y - 13}" fill="var(--muted)">${esc(t.length > fit ? t.slice(0, fit - 1) + '…' : t)}</text>`;
    }
  });
  // where you are, said on the line itself
  if (labels && cur) g += `<text x="${cur.x}" y="${cur.y + 26}" fill="${c.accent}" text-anchor="${cur.x > 480 ? 'end' : 'start'}">在这里 · ${esc(cur.l.title)}</text>`;
  return g;
}
/** The lesson's steps as a short line of marks (the same marks as the rail). */
function steps_line(svg, L, at) {
  const w = svg.clientWidth || 400, n = L.steps.length, x = (i) => 6 + (i / (n - 1)) * (w - 12), y = 12;
  let g = `<path d="M${x(0)},${y}H${x(n - 1)}" stroke="var(--hair2)"/><path d="M${x(0)},${y}H${x(at - 1)}" stroke="var(--accent)" stroke-width="2"/>`;
  L.steps.forEach((s, i) => {
    const attrs = s.n === at ? `fill="var(--paper)" stroke="var(--accent)" stroke-width="2"` : s.n < at ? `fill="var(--accent)" stroke="var(--accent)"` : `fill="var(--paper)" stroke="var(--faint)" stroke-width="1.25"`;
    g += kind_mark(s.kind, x(i), y, s.n === at ? 6 : 3.6, attrs);
  });
  svg.innerHTML = g;
}
// a plate that appears over a station (hover, or a tap on phones)
let tip;
function tips(root) {
  tip?.remove();
  tip = document.createElement('div');
  tip.className = 'plate-tip';
  document.body.append(tip);
  root.querySelectorAll('.st').forEach((g) => {
    const show = () => {
      const c = course(g.dataset.c), l = all(c)[+g.dataset.i];
      tip.innerHTML = `${plate(l, { label: c.short || '' })}<div class="t">${esc(l.title)}</div><div class="mono">${pad(+g.dataset.i + 1)} · ${l.minutes} 分钟${l.status === 'done' ? ' · 学过' : l.status === 'current' ? ' · 在这里' : ''}</div>`;
      const b = g.getBoundingClientRect();
      tip.style.left = `${Math.min(Math.max(b.left + b.width / 2 - 120, 12), innerWidth - 252) + scrollX}px`;
      tip.style.top = `${b.top + scrollY - 12}px`;
      tip.style.transform = 'translateY(-100%)';
      tip.classList.add('on');
    };
    g.addEventListener('mouseenter', show);
    g.addEventListener('mouseleave', () => tip.classList.remove('on'));
    g.addEventListener('click', (e) => { if (matchMedia('(hover: none)').matches && !tip.classList.contains('on')) { e.preventDefault(); show(); } else location.hash = `#/course/${g.dataset.c}`; });
  });
}

// ---------------------------------------------------------------- home
function home(app) {
  const c = recent(), cur = current(c), p = c.progress;
  accent(c);
  const wide = innerWidth > 700;
  const W = Math.min(1200, innerWidth - (wide ? 96 : 40)) - (wide ? 232 : 0) - 36; // room for the half-turns at both ends
  const k = W / 720; // the whole site shares one scale: 720 minutes fill a row
  app.innerHTML = `${bar()}
  <main class="wrap">
    <section class="here">
      <div>
        <div class="where mono"><b>${esc(c.title)}</b> · 第 ${all(c).indexOf(cur) + 1} 课，共 ${all(c).length} 课</div>
        <h1>${esc(cur.title)}</h1>
        <svg class="local" id="local"></svg>
        <div class="go"><a class="btn primary" href="#/lesson/${p.step}">继续 ${ARROW}</a><span class="mono">第 ${p.step} 步 · ${esc(lesson.steps[p.step - 1].title)}</span></div>
      </div>
      <a href="#/lesson/${p.step}">${plate(cur, { full: true })}</a>
    </section>
    <section class="atlas">
      <div class="head mono"><span>全部课程</span><span>线长 = 时长</span></div>
      ${courses.map((x) => {
        const R = layout(x, W, k, 34, 8);
        return `<a class="line-row" href="#/course/${x.id}" style="--accent:${x.accent}"><span class="name"><b>${esc(x.title)}</b><span class="mono">${x.lessonCount} 课 · ${hours(x.minutes)}${x.progress ? ` · 学过 ${x.progress.done}` : ''}</span></span><svg width="${W + 36}" height="${(R.rows - 1) * 34 + 30}" style="margin-top:22px"><g transform="translate(18,0)">${draw_line(x, R)}</g></svg></a>`;
      }).join('')}
      <div class="scale mono"><i style="width:${(k * 60).toFixed(1)}px"></i>1 小时</div>
    </section>
  </main>`;
  steps_line(app.querySelector('#local'), lesson, p.step);
  tips(app);
}

// ---------------------------------------------------------------- course: the walk
function coursePage(app, id) {
  const c = course(id) || course('mpc'), cur = current(c), L = all(c);
  accent(c);
  let t = 0;
  const clock = (m) => `${Math.floor(m / 60)}:${pad(m % 60)}`;
  const stops = c.units.map((u, ui) => `
    <div class="district" id="u${ui}"><span class="n mono">${pad(ui + 1)}</span><h2>${esc(u.title)}<small>${u.lessons.length} 课 · ${hours(u.lessons.reduce((n, l) => n + (l.minutes || 0), 0))}</small></h2></div>
    ${u.lessons.map((l) => {
      const n = L.indexOf(l) + 1, at = t;
      t += l.minutes || 15;
      const href = c.id === 'mpc' && l.status === 'current' ? `#/lesson/${c.progress.step}` : '#';
      return `<a class="stop ${l.status}" href="${href}" style="--m:${l.minutes || 15}" data-n="${n}">
        <span class="t0 mono">${clock(at)}</span><span class="dot"></span>
        ${plate(l, { label: `${c.short || ''} · ${pad(n)}` })}
        <span class="txt"><span class="mono">${pad(n)} · ${l.minutes} 分钟${l.status === 'done' ? ' · <span class="ok">学过</span>' : ''}</span><b>${esc(l.title)}</b><p>${esc(l.summary)}</p>
        ${l.status === 'current' ? `<span class="btn primary resume">继续 · 第 ${c.progress.step} 步 ${ARROW}</span>` : ''}</span>
      </a>`;
    }).join('')}`).join('');
  app.innerHTML = `${bar()}
  <main class="wrap">
    <section class="c-head">
      <a class="back mono" href="#/">← 全部课程</a>
      <h1>${esc(c.title)}</h1>
      <p>${esc(c.summary)}</p>
    </section>
    <div class="walk">
      <div class="route" id="route">
        <div class="done-line" id="dl"></div>
        <div class="end"><span class="dot"></span><div class="k"><span class="mono">出发</span><p>${esc(c.prereq?.line || c.audience || '从第一课开始，不需要准备。')}</p>${c.prereq ? `<div class="links">${c.prereq.links.map((x) => `<a href="#">${esc(x)}</a>`).join('')}</div>` : ''}
          <div style="margin-top:24px">${cur ? `<a class="btn primary" href="${c.id === 'mpc' ? `#/lesson/${c.progress.step}` : '#'}">继续 <small>${pad(L.indexOf(cur) + 1)} · ${esc(cur.title)}</small> ${ARROW}</a>` : `<a class="btn primary" href="#">开始 <small>01 · ${esc(L[0].title)}</small> ${ARROW}</a>`}</div></div></div>
        ${stops}
        <div class="end fin"><span class="dot"></span><div class="k"><span class="mono">到达 · ${hours(c.minutes)}之后</span>${c.outcomes ? `<ol>${c.outcomes.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : `<p>${esc(c.summary)}</p>`}</div></div>
      </div>
      <aside class="mini"><div class="mono">${L.length} 课 · ${hours(c.minutes)}</div><svg id="mini"></svg></aside>
    </div>
  </main>`;
  // the line is filled up to the stop you're at
  requestAnimationFrame(() => {
    const route = app.querySelector('#route'), here = app.querySelector('.stop.current .dot') || (L.some((l) => l.status === 'done') ? [...app.querySelectorAll('.stop.done .dot')].pop() : null);
    if (here) app.querySelector('#dl').style.height = `${here.getBoundingClientRect().top - route.getBoundingClientRect().top}px`;
    mini(app, c);
  });
}
/** The overview beside the walk: the same route drawn small, units as segments, the visible part bracketed. */
function mini(app, c) {
  const svg = app.querySelector('#mini');
  if (!svg || !svg.getClientRects().length) return;
  const H = Math.min(innerHeight - 160, 520), k = H / c.minutes, X = 8;
  let y = 0, g = '';
  const marks = [];
  c.units.forEach((u, ui) => {
    const y0 = y;
    u.lessons.forEach((l) => {
      const h = (l.minutes || 15) * k;
      g += `<rect x="${X - 2}" y="${y + 1}" width="5" height="${Math.max(1, h - 2)}" fill="${l.status === 'new' ? 'var(--hair2)' : c.accent}" ${l.status === 'current' ? `stroke="${c.accent}" fill="var(--paper)"` : ''}/>`;
      y += h;
    });
    marks.push(`<g class="u" data-u="${ui}"><rect x="0" y="${y0}" width="220" height="${y - y0}" fill="transparent"/><text x="${X + 16}" y="${y0 + 10}">${pad(ui + 1)} ${esc(u.title.slice(0, 12))}</text></g>`);
  });
  svg.setAttribute('width', 220);
  svg.setAttribute('height', H + 2);
  svg.innerHTML = g + marks.join('') + `<rect id="view" x="0" y="0" width="16" height="0" fill="none" stroke="var(--ink)" stroke-width="1"/>`;
  svg.querySelectorAll('.u').forEach((u) => u.addEventListener('click', () => document.getElementById(`u${u.dataset.u}`).scrollIntoView({ behavior: 'smooth' })));
  const route = app.querySelector('#route'), view = svg.querySelector('#view');
  const track = () => {
    const rb = route.getBoundingClientRect(), total = rb.height;
    const a = Math.max(0, -rb.top) / total, b = Math.min(1, (innerHeight - rb.top) / total);
    view.setAttribute('y', (a * H).toFixed(1));
    view.setAttribute('height', Math.max(4, (b - a) * H).toFixed(1));
  };
  track();
  addEventListener('scroll', track, { passive: true });
}

// ---------------------------------------------------------------- lesson: the walk continues as steps
let ticker;
function lessonPage(app, step) {
  const c = course('mpc'), L = lesson, at = Math.min(Math.max(+step || L.at, 1), L.steps.length);
  accent(c);
  clearInterval(ticker);
  const s = L.steps[at - 1], page = L.pages[at], prevS = L.steps[at - 2], next = L.steps[at];
  const nextOpen = [1, 5, 6, 8].find((n) => n > at) || at;
  const head = `${prevS ? `<div class="prev"><span class="mono">${pad(at - 1)}</span>${esc(prevS.title)}</div>` : ''}<div class="phone-at"><span class="mono">${pad(at)} / ${L.steps.length}</span><svg id="pl"></svg></div><div class="step-h"><span class="mono">${pad(at)} · ${KIND[s.kind]}</span><h2>${esc(s.title)}</h2></div>`;
  const ahead = next ? `<div class="ahead"><a class="btn primary" href="#/lesson/${nextOpen}">继续 ${ARROW}</a><span class="peek"><span class="mono">${pad(at + 1)} · ${KIND[next.kind]}</span>${esc(next.title)}</span></div>` : '';
  const ask = (asks) => `<div class="ask"><div class="mono">问 · ${pad(at)}</div>${(asks || []).map((q) => `<span class="q">${q}</span>`).join('')}<div class="line">问这一页……</div></div>`;
  let main, cls = 'text', marginHtml = '';
  if (!page) main = `${head}<p class="muted">（原型只做了第 1、5、6、8 步。）</p>${ahead}`;
  else if (s.kind === 'scene') {
    cls = '';
    main = `${head}<figure class="figure" style="margin:0">${plate({ thumb: page.figure }, { full: true })}<div class="aside">${esc(page.caption)}</div>
      <div class="player"><button class="pp"><svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z" fill="currentColor"/></svg></button><div class="segs">${page.lines.map((_, i) => `<i><b style="--p:${i < page.line ? 100 : i === page.line ? 40 : 0}%"></b></i>`).join('')}</div><span class="mono">0:${pad(page.at)} / 0:${pad(page.seconds)}</span></div>
      <p class="say">${esc(page.lines[page.line])}</p></figure>${ahead}`;
    marginHtml = ask(page.asks);
  } else if (s.kind === 'check') {
    main = `<div class="quiz">${head}<div class="q">${page.q}</div>${page.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="mono">${'ABCD'[i]}</span><span>${o}</span><span class="verdict"></span></button>`).join('')}<div class="why" hidden>${page.explain}</div>${ahead}</div>`;
    marginHtml = ask(['两个计划的平均刹车时刻各是多少？']);
  } else {
    main = `<div class="read">${head}${page.paras.map((p, i) => `<p data-i="${i}">${p}${page.note && page.note.para === i ? '<sup>1</sup>' : ''}</p>`).join('')}${page.aside ? `<div class="aside-note">${page.aside}</div>` : ''}${ahead}</div>`;
    marginHtml = ask(page.asks) + (page.note ? `<div class="note" id="note"><div class="mono">问 · 01</div><div class="q">${esc(page.note.q)}</div><div class="a">${page.note.a}</div></div>` : '');
  }
  const rail = `<nav class="rail"><ol><span class="done-line" id="rl"></span>${L.steps.map((x) => {
    const st = x.n < at ? 'done' : x.n === at ? 'here' : '';
    const attrs = x.n === at ? `fill="var(--paper)" stroke="var(--accent)" stroke-width="2"` : x.n < at ? `fill="var(--ink)" stroke="var(--ink)"` : `fill="var(--paper)" stroke="var(--faint)" stroke-width="1.25"`;
    return `<li class="${st}" data-n="${x.n}"><svg viewBox="0 0 16 16">${kind_mark(x.kind, 8, 8, x.n === at ? 5.5 : 4, attrs)}</svg><span>${x.n === at ? `<span class="k">${pad(x.n)} · ${KIND[x.kind]}</span>` : ''}${esc(x.title)}</span></li>`;
  }).join('')}</ol></nav>`;
  app.innerHTML = `<header class="wrap l-bar"><a class="crs" href="#/course/mpc">← ${esc(c.title)}</a><span class="sl">/</span><h1>${esc(L.title)}</h1><nav><a href="#">数据</a><a href="#">设置</a><span class="me">L</span></nav></header>
  <main class="wrap"><div class="room ${cls}">${rail}<div class="main">${main}</div><aside class="margin">${marginHtml}</aside></div></main>
  <div class="dock"><button class="btn quiet">问</button><a class="btn primary" href="#/lesson/${nextOpen}">继续 ${ARROW}</a></div>`;
  app.querySelectorAll('.rail li').forEach((li) => li.addEventListener('click', () => (location.hash = `#/lesson/${li.dataset.n}`)));
  const pl = app.querySelector('#pl');
  if (pl) steps_line(pl, L, at);
  requestAnimationFrame(() => {
    const here = app.querySelector('.rail li.here svg'), ol = app.querySelector('.rail ol');
    if (here) app.querySelector('#rl').style.height = `${here.getBoundingClientRect().top - ol.getBoundingClientRect().top}px`;
  });
  if (s.kind === 'check' && page) app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    app.querySelectorAll('.opt').forEach((o) => {
      const j = +o.dataset.i;
      o.classList.toggle('right', j === page.right);
      o.classList.toggle('wrong', j === i && i !== page.right);
      o.querySelector('.verdict').textContent = j === page.right ? '对' : j === i ? '你选的' : '';
    });
    app.querySelector('.why').hidden = false;
  }));
  if (s.kind === 'scene' && page) {
    const pp = app.querySelector('.pp'), say = app.querySelector('.say'), segs = [...app.querySelectorAll('.segs b')];
    let line = page.line, prog = 40, on = false;
    pp.addEventListener('click', () => {
      on = !on;
      pp.innerHTML = on ? '<svg viewBox="0 0 14 14"><path d="M3 1h3v12H3zM8 1h3v12H8z" fill="currentColor"/></svg>' : '<svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z" fill="currentColor"/></svg>';
      clearInterval(ticker);
      if (on) ticker = setInterval(() => {
        prog += 4;
        if (prog >= 100) { prog = 0; line = (line + 1) % page.lines.length; }
        segs.forEach((b, i) => b.style.setProperty('--p', `${i < line ? 100 : i === line ? prog : 0}%`));
        say.textContent = page.lines[line];
      }, 160);
    });
  }
  const note = app.querySelector('#note');
  if (note && innerWidth > 1180) requestAnimationFrame(() => {
    const p = app.querySelector(`.read p[data-i="${page.note.para}"]`), margin = app.querySelector('.margin');
    const mb = margin.getBoundingClientRect(), pb = p.getBoundingClientRect();
    note.style.top = `${pb.top - mb.top}px`;
    const sup = p.querySelector('sup').getBoundingClientRect(), y = sup.top - mb.top + 6;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('leader');
    svg.innerHTML = `<path d="M${sup.right - mb.left + 6},${y}H-14" stroke="var(--accent)" stroke-width="1" stroke-dasharray="1.5 4" fill="none"/><circle cx="-14" cy="${y}" r="2.2" fill="var(--accent)"/>`;
    margin.append(svg);
  });
}

UI.switcher('atlas');
UI.start((r, ctx) => {
  const app = document.getElementById('app');
  if (r.page === 'course') coursePage(app, r.id);
  else if (r.page === 'lesson') {
    lessonPage(app, r.id);
    if (ctx.from?.page === 'lesson') app.querySelectorAll('.room .main').forEach((el) => UI.step_in(el, +(ctx.from.id || lesson.at), +(r.id || lesson.at)));
  }
  else home(app);
});
</script>
