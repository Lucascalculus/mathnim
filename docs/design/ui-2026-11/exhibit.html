<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathnim · 展厅</title>
<link rel="stylesheet" href="base.css">
<style>
/* 展厅 (Exhibit): the figures are the exhibits. Home is the central hall where every course hangs at once (Kahn's
   Exeter), the course page is the plan of one exhibition, the lesson is a room where the figure gets the light and
   its text hangs beside it (Scarpa, Kimbell, Ciechanowski). Labels are set like museum wall labels. */
:root { --w: 1200px; --side: 48px; }
.wrap { max-width: calc(var(--w) + 2 * var(--side)); margin: 0 auto; padding: 0 var(--side); }

/* the bar: the name and three tools */
.bar { height: 64px; display: flex; align-items: center; }
.bar .logo { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.bar .logo svg { width: 22px; height: 22px; }
.bar nav { margin-left: auto; display: flex; gap: 22px; align-items: center; font-size: 13.5px; color: var(--muted); }
.bar nav a:hover { color: var(--ink); }
.me { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px var(--ink); display: grid; place-items: center; font: 600 13px/1 var(--serif); color: var(--ink); }

/* a wall label: what, which, how long; the catalogue line in mono */
.label .cat { color: var(--muted); display: flex; gap: 10px; align-items: center; }
.label .cat b { color: var(--accent); font-weight: 500; }
.label .t { font-weight: 600; letter-spacing: -.01em; }

/* ---------------------------------------------------------------- home: the hall */
.here { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--s8); align-items: center; padding: var(--s7) 0 var(--s9); }
.here .plate { box-shadow: 0 0 0 1px var(--hair), var(--lift-hi); }
.here .label .t { font-size: var(--t-lesson); line-height: 1.12; letter-spacing: -.03em; margin: var(--s4) 0 var(--s4); text-wrap: balance; }
.here .label p { color: var(--ink2); font-size: 16px; line-height: 1.7; max-width: 30em; }
.here .at { margin: var(--s6) 0 var(--s5); display: grid; gap: 10px; }
.here .at .mono { color: var(--muted); }
.here .at .mono b { color: var(--ink); font-weight: 500; }
.here .at svg { display: block; width: 100%; max-width: 380px; height: 22px; overflow: visible; }

.wall { padding: 0 0 var(--s10); }
.wall > .mono { color: var(--muted); padding-bottom: var(--s4); border-bottom: 1px solid var(--ink); margin-bottom: var(--s7); display: flex; justify-content: space-between; }
.wall .group + .group { margin-top: var(--s8); }
.wall .group > .mono { color: var(--muted); margin-bottom: var(--s5); }
.rooms { display: grid; gap: 0; }
.room { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 5fr) minmax(0, 3fr); gap: var(--s6); align-items: center; padding: var(--s5) 0; border-top: 1px solid var(--hair); }
.room:first-child { border-top: 0; }
.room .plate { transition: box-shadow var(--d-smooth) var(--smooth), transform var(--d-smooth) var(--smooth); }
.room:hover .plate { box-shadow: 0 0 0 1px var(--hair), var(--lift); transform: translateY(-2px); }
.room .label .t { font-size: 24px; line-height: 1.25; letter-spacing: -.02em; margin: 10px 0 8px; }
.room .label p { color: var(--ink2); font-size: 14.5px; line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 34em; }
.room .state { display: grid; gap: 12px; align-content: center; }
.room .state .mono { color: var(--muted); }
.room .state .mono b { color: var(--accent); font-weight: 500; }
.room .state .resume { color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; line-height: 1.4; }
.room .state .resume span { color: var(--ink2); font-weight: 400; }
.room .ticks { display: flex; gap: 2px; flex-wrap: wrap; max-width: 100%; }
.room .ticks i { width: 5px; height: 12px; background: var(--hair2); }
.room .ticks i.done { background: var(--accent); }
.room .ticks i.cur { background: var(--white); box-shadow: inset 0 0 0 1.5px var(--accent); }
.room .ticks i.gap { width: 6px; background: none; }
/* a course whose lessons have no scenes: its contents set as the plate (a book's contents page) */
.contents { aspect-ratio: 16 / 10; background: var(--white); padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.contents .h { font: 650 19px/1.25 var(--sans); letter-spacing: -.01em; }
.contents ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.contents li { display: grid; grid-template-columns: 26px 1fr; font-size: 12px; line-height: 1.45; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contents li span { font: 500 10.5px/1.6 var(--mono); color: var(--muted); }

/* ---------------------------------------------------------------- course: the exhibition plan */
.c-head { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: var(--s8); padding: var(--s7) 0 var(--s7); align-items: end; }
.c-head .back { color: var(--muted); }
.c-head .back:hover { color: var(--ink); }
.c-head h1 { font-size: var(--t-course); line-height: 1; letter-spacing: -.045em; margin: var(--s5) 0 var(--s5); font-weight: 700; }
.c-head .sum { color: var(--ink2); font-size: 18px; line-height: 1.7; max-width: 34em; }
.c-head .pre { color: var(--muted); font-size: 14.5px; line-height: 1.7; margin-top: var(--s3); max-width: 38em; }
.c-head .pre a { color: var(--ink2); text-decoration: underline; text-decoration-color: var(--hair2); text-underline-offset: 3px; }
.c-head .go { margin-top: var(--s6); }
.c-head .out > .mono { color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--hair); }
.c-head ol { margin: 0; padding: 0; list-style: none; counter-reset: o; }
.c-head ol li { counter-increment: o; display: grid; grid-template-columns: 30px 1fr; padding: 14px 0; border-bottom: 1px solid var(--hair); font-size: 15px; line-height: 1.6; }
.c-head ol li::before { content: counter(o, decimal-leading-zero); font: 500 11.5px/2.1 var(--mono); color: var(--accent); }

/* the floor plan: every lesson as a bay whose width is its minutes; units separated by a wider gap */
.plan { margin: var(--s4) 0 var(--s9); }
.plan .bays { display: flex; gap: 3px; height: 30px; align-items: stretch; }
.plan .bay { flex: var(--m) 1 0; min-width: 6px; background: var(--wash); box-shadow: inset 0 0 0 1px var(--hair); transition: background-color .2s; position: relative; }
.plan .bay.done { background: var(--accent); box-shadow: none; opacity: .9; }
.plan .bay.current { background: var(--white); box-shadow: inset 0 0 0 2px var(--accent); }
.plan .bay:hover { background: var(--hair2); }
.plan .bay.done:hover { opacity: 1; background: var(--accent); }
.plan .sep { flex: 0 0 18px; }
.plan .names { display: flex; gap: 3px; margin-top: 10px; }
.plan .names span { flex: var(--m) 1 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .names .sep { flex: 0 0 18px; }
.plan .here-mark { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); color: var(--accent); white-space: nowrap; }

.unit { padding: 0 0 var(--s8); }
.unit .uh { display: grid; grid-template-columns: 64px 1fr auto; align-items: baseline; padding-bottom: var(--s4); border-bottom: 1px solid var(--ink); margin-bottom: var(--s6); }
.unit .uh .mono { color: var(--muted); }
.unit .uh h2 { margin: 0; font-size: 24px; letter-spacing: -.02em; font-weight: 650; }
.works { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s7) var(--s6); }
.work { display: block; position: relative; }
.work .plate { transition: box-shadow var(--d-smooth) var(--smooth), transform var(--d-smooth) var(--smooth); }
.work:hover .plate { box-shadow: 0 0 0 1px var(--hair), var(--lift); transform: translateY(-2px); }
.work.current .plate { box-shadow: 0 0 0 1.5px var(--accent), var(--lift-hi); }
.work .label { margin-top: var(--s4); }
.work .label .t { font-size: 16px; line-height: 1.4; margin: 7px 0 5px; }
.work .label p { color: var(--muted); font-size: 13.5px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.work .label .cat .ok { color: var(--accent); }
.work .resume { margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }

/* ---------------------------------------------------------------- lesson: the room */
.l-bar { position: sticky; top: 0; z-index: 30; background: var(--paper); transition: box-shadow .2s, opacity var(--d-smooth) var(--smooth); }
.l-bar.scrolled { box-shadow: 0 1px 0 var(--hair); }
.l-bar .row { height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s5); }
.l-bar .crs { color: var(--muted); font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; }
.l-bar .crs:hover { color: var(--ink); }
.l-bar h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.005em; text-align: center; }
.l-bar .count { justify-self: end; color: var(--muted); }
.strip { display: block; width: 100%; height: 34px; overflow: visible; margin: 0 0 4px; }
.strip .s { cursor: pointer; }
.strip .s:hover .m { stroke: var(--ink); }
.strip text { font: 500 11px var(--mono); letter-spacing: .06em; fill: var(--muted); }

.room-l { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--s7); padding: var(--s6) 0 var(--s10); align-items: start; transition: opacity var(--d-smooth) var(--smooth); }
.room-l.text { grid-template-columns: minmax(0, 640px) 280px; justify-content: center; gap: var(--s8); }
.step-h { margin: 0 0 var(--s5); display: grid; gap: 10px; }
.step-h .mono { color: var(--muted); }
.step-h h2 { margin: 0; font-size: var(--t-step); line-height: 1.25; letter-spacing: -.02em; font-weight: 650; }

/* the exhibit: the figure on its white plate, lit, its label a faint line beneath */
.stage .plate.full { box-shadow: 0 0 0 1px var(--hair), var(--lift-hi); }
.stage .aside { margin-top: 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.player { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: var(--s4); align-items: center; margin-top: var(--s5); }
.player .pp { width: 44px; height: 44px; border-radius: 22px; background: var(--ink); color: #fff; display: grid; place-items: center; }
.player .pp svg { width: 14px; height: 14px; }
.player .segs { display: flex; gap: 4px; height: 20px; align-items: center; cursor: pointer; }
.player .segs i { flex: 1; height: 3px; background: var(--hair2); position: relative; border-radius: 2px; overflow: hidden; }
.player .segs i b { position: absolute; inset: 0; width: var(--p, 0%); background: var(--ink); }
.player .time { color: var(--muted); }
.say { margin-top: var(--s5); font-size: 19px; line-height: 1.75; color: var(--ink); max-width: 40em; min-height: 3.5em; }
.say .past { color: var(--faint); }

/* room lights: while the scene plays, everything but the exhibit steps back */
body.playing .l-bar, body.playing .margin, body.playing .step-h { opacity: .32; }
body.playing { background: #f3f3ef; transition: background-color .6s; }

/* the reading */
.read p { font-size: var(--t-body); line-height: 1.8; margin: 0 0 var(--s5); color: #202328; }
.read p b { font-weight: 650; }
.read .aside-note { border-left: 2px solid var(--ink); padding: 2px 0 2px var(--s5); margin: var(--s6) 0; color: var(--ink2); font-size: 15.5px; line-height: 1.75; }
.read .aside-note .mono { color: var(--muted); display: block; margin-bottom: 6px; }
.read mark { background: linear-gradient(transparent 58%, var(--hl-1) 58%); color: inherit; }
.read sup { font: 600 10.5px/1 var(--mono); color: var(--accent); margin-left: 2px; }

/* the question */
.quiz .q { font-size: 20px; line-height: 1.7; margin-bottom: var(--s6); }
.quiz .opt { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: var(--s3); width: 100%; text-align: left; padding: 15px 18px; margin-bottom: 10px; background: var(--white); box-shadow: inset 0 0 0 1px var(--hair2); font-size: 16.5px; line-height: 1.6; transition: box-shadow .15s; }
.quiz .opt:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.quiz .opt .mono { color: var(--muted); }
.quiz .opt.right { box-shadow: inset 0 0 0 2px var(--accent); }
.quiz .opt.right .mono, .quiz .opt.right .verdict { color: var(--accent); }
.quiz .opt.wrong { box-shadow: inset 0 0 0 1.5px var(--ink2); color: var(--muted); }
.quiz .opt.wrong .verdict { color: var(--ink2); }
.quiz .verdict { font: 500 11px/1 var(--mono); letter-spacing: .06em; }
.quiz .why { margin-top: var(--s5); font-size: 17px; line-height: 1.8; color: #202328; }

/* the margin: the guide's place. Quiet at rest. */
.margin { position: relative; transition: opacity var(--d-smooth) var(--smooth); }
.ask { position: sticky; top: 120px; }
.ask > .mono { color: var(--muted); display: flex; justify-content: space-between; }
.ask .q { display: block; margin-top: 14px; font-size: 14px; line-height: 1.55; color: var(--muted); padding-left: 16px; position: relative; transition: color .15s; cursor: pointer; }
.ask .q::before { content: ''; position: absolute; left: 0; top: .78em; width: 8px; height: 1.25px; background: currentColor; }
.ask .q:hover { color: var(--ink); }
.ask .line { margin-top: 22px; border-bottom: 1.25px solid var(--ink2); height: 34px; font: 15px/34px var(--serif); color: var(--faint); }
.note { position: absolute; left: 0; right: 0; background: var(--paper); }
.note .mono { color: var(--accent); }
.note .q { font-size: 14px; font-weight: 600; line-height: 1.55; margin: 8px 0 6px; }
.note .a { font: 15.5px/1.75 var(--serif); color: var(--ink2); }
.leader { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

.next { margin-top: var(--s7); display: flex; align-items: center; gap: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--hair); }
.next .peek { color: var(--faint); font-size: 14px; }
.next .peek b { color: var(--muted); font-weight: 500; }
.next .btn { margin-left: auto; }

/* phone: the hall narrows to one column; the room keeps the exhibit full width, the guide becomes a capsule */
.dock { display: none; }
@media (max-width: 1100px) {
  :root { --side: 28px; }
  .room { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .room .state { grid-column: 2; }
  .works { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .room-l, .room-l.text { grid-template-columns: minmax(0, 1fr); }
  .margin { display: none; }
}
@media (max-width: 700px) {
  :root { --side: 20px; --t-course: 44px; --t-lesson: 30px; --t-step: 24px; }
  .bar nav a { display: none; }
  .here, .c-head { grid-template-columns: 1fr; gap: var(--s6); padding-top: var(--s4); }
  .room { grid-template-columns: 1fr; gap: var(--s4); padding: var(--s6) 0; }
  .room .state { grid-column: 1; }
  .works { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s6) var(--s4); }
  .work .label p { display: none; }
  .work .label .t { font-size: 14.5px; }
  .plan .names { display: none; }
  .plan .bays { gap: 1.5px; }
  .plan .bay { min-width: 1px; }
  .plan .sep { flex-basis: 7px; }
  .plan .here-mark { display: none; }
  .l-bar h1 { display: none; }
  .l-bar .row { grid-template-columns: 1fr auto; }
  .stage { margin: 0 calc(-1 * var(--side)); }
  .stage .plate.full .crops { display: none; }
  .stage .aside, .stage .player, .stage .say { margin-left: var(--side); margin-right: var(--side); }
  .player { grid-template-columns: 44px minmax(0, 1fr) auto; }
  .player .btn { display: none; }
  .say { font-size: 17.5px; }
  .read p { font-size: 17px; }
  .next .peek { display: none; }
  .dock { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40; gap: 8px; padding: 8px; background: var(--white); border-radius: var(--r-panel); box-shadow: var(--lift-hi); }
  .dock .btn { height: 44px; border-radius: var(--r-inner); }
  .dock .btn.primary { flex: 1; justify-content: center; }
  .room-l { padding-bottom: 120px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="base.js"></script>
<script>
const { courses, lesson, course, all, current, recent, unit_of, esc, hours, pad, plate, kind_mark, KIND, ARROW, LOGO } = UI;
const bar = () => `<header class="wrap bar"><a class="logo" href="#/">${LOGO}Mathnim</a><nav><a href="#">数据</a><a href="#">设置</a><span class="me">L</span></nav></header>`;
const accent = (c) => document.documentElement.style.setProperty('--accent', c.accent);

/** A course's plate on the hall's wall: its signature figure, or its contents set as type. */
function course_plate(c) {
  if (c.cover) {
    const l = { thumb: c.cover, title: c.title };
    return plate(l, { full: true });
  }
  return `<span class="plate"><span class="contents"><span class="h">${esc(c.title)}</span><ol>${c.units.slice(0, 6).map((u, i) => `<li><span>${pad(i + 1)}</span>${esc(u.title)}</li>`).join('')}${c.units.length > 6 ? `<li><span>…</span>还有 ${c.units.length - 6} 个单元</li>` : ''}</ol></span><span class="crops"><i></i><i></i><i></i><i></i></span></span>`;
}
/** One tick per lesson, units a little apart: done, here, ahead. A word-sized picture of a course. */
const ticks = (c) => `<span class="ticks">${c.units.map((u) => u.lessons.map((l) => `<i class="${l.status === 'done' ? 'done' : l.status === 'current' ? 'cur' : ''}"></i>`).join('')).join('<i class="gap"></i>')}</span>`;

/** The lesson's steps as marks: each kind its own shape; done in ink, here in the course's colour, ahead hollow. */
function strip(svg, L, at, { names = true } = {}) {
  const w = svg.clientWidth || 600, n = L.steps.length, x = (i) => 8 + (i / (n - 1)) * (w - 16), y = 12;
  let g = `<path d="M${x(0)},${y}H${x(n - 1)}" stroke="var(--hair2)" stroke-width="1"/><path d="M${x(0)},${y}H${x(at - 1)}" stroke="var(--ink)" stroke-width="1.25"/>`;
  L.steps.forEach((s, i) => {
    const done = s.n < at, here = s.n === at;
    const attrs = here ? `fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"` : done ? `fill="var(--ink)" stroke="var(--ink)" stroke-width="1"` : `fill="var(--paper)" stroke="var(--faint)" stroke-width="1.25"`;
    g += `<g class="s" data-n="${s.n}"><title>${s.n} · ${esc(s.title)}</title><rect x="${x(i) - 12}" y="${y - 12}" width="24" height="24" fill="transparent"/>${kind_mark(s.kind, x(i), y, here ? 5.5 : 4, `class="m" ${attrs}`)}</g>`;
  });
  if (names) {
    const s = L.steps[at - 1], xi = x(at - 1), anchor = xi < 80 ? 'start' : xi > w - 80 ? 'end' : 'middle';
    g += `<text x="${xi}" y="${y + 24}" text-anchor="${anchor}" fill="var(--accent)">${pad(at)} ${esc(KIND[s.kind])}</text>`;
  }
  svg.innerHTML = g;
}

// ---------------------------------------------------------------- home: the hall
function home(app) {
  const c = recent(), cur = current(c), p = c.progress;
  accent(c);
  const groups = [...new Set(courses.map((x) => x.category))];
  app.innerHTML = `${bar()}
  <main class="wrap">
    <section class="here">
      <a href="#/lesson/${p.step}">${plate(cur, { full: true })}</a>
      <div class="label">
        <div class="cat mono"><b>${esc(c.title)}</b><span>第 ${all(c).indexOf(cur) + 1} 课 · ${cur.minutes} 分钟</span></div>
        <div class="t">${esc(cur.title)}</div>
        <p>${esc(cur.summary)}</p>
        <div class="at"><div class="mono">第 <b>${p.step}</b> 步，共 ${p.steps} 步 · <b>${esc(lesson.steps[p.step - 1].title)}</b></div><svg id="at"></svg></div>
        <a class="btn primary" href="#/lesson/${p.step}">继续 ${ARROW}</a>
      </div>
    </section>
    <section class="wall">
      <div class="mono"><span>全部课程</span><span>${courses.length} 门 · ${courses.reduce((n, x) => n + x.lessonCount, 0)} 课</span></div>
      ${groups.map((g) => `<div class="group"><div class="mono">${esc(g)}</div><div class="rooms">${courses.filter((x) => x.category === g).map((x) => `
        <a class="room" href="#/course/${x.id}" style="--accent:${x.accent}">
          ${course_plate(x)}
          <div class="label">
            <div class="cat mono"><span>${x.lessonCount} 课 · ${hours(x.minutes)}</span></div>
            <div class="t">${esc(x.title)}</div>
            <p>${esc(x.summary)}</p>
          </div>
          <div class="state">
            <div class="mono">${x.progress ? `已学 <b>${x.progress.done}</b> / ${x.lessonCount}` : '还没开始'}</div>
            ${ticks(x)}
            ${current(x) ? `<span class="resume">继续 ${ARROW}<span>${esc(current(x).title)}</span></span>` : ''}
          </div>
        </a>`).join('')}</div></div>`).join('')}
    </section>
  </main>`;
  strip(app.querySelector('#at'), lesson, p.step, { names: false });
}

// ---------------------------------------------------------------- course: the exhibition plan
function coursePage(app, id) {
  const c = course(id) || course('mpc'), cur = current(c), L = all(c);
  accent(c);
  const first = cur || L[0];
  const go = cur ? `<a class="btn primary go" href="${c.id === 'mpc' ? `#/lesson/${c.progress.step}` : '#'}">继续 <small>${pad(L.indexOf(cur) + 1)} · ${esc(cur.title)}</small> ${ARROW}</a>`
    : `<a class="btn primary go" href="#">开始 <small>01 · ${esc(first.title)}</small> ${ARROW}</a>`;
  const bays = c.units.map((u) => u.lessons.map((l) => `<a class="bay ${l.status}" style="--m:${l.minutes || 15}" href="#u${c.units.indexOf(u)}" title="${pad(L.indexOf(l) + 1)} ${esc(l.title)} · ${l.minutes} 分钟">${l.status === 'current' ? '<span class="here-mark mono">在这里</span>' : ''}</a>`).join('')).join('<span class="sep"></span>');
  const names = c.units.map((u) => `<span class="mono" style="--m:${u.lessons.reduce((n, l) => n + (l.minutes || 15), 0)}">${pad(c.units.indexOf(u) + 1)} ${esc(u.title)}</span>`).join('<span class="sep"></span>');
  app.innerHTML = `${bar()}
  <main class="wrap">
    <section class="c-head">
      <div>
        <a class="back mono" href="#/">← 全部课程</a>
        <h1>${esc(c.title)}</h1>
        <p class="sum">${esc(c.summary)}</p>
        ${c.prereq ? `<p class="pre">${esc(c.prereq.line)} 先读：${c.prereq.links.map((x) => `<a href="#">${esc(x)}</a>`).join('、')}</p>` : ''}
        ${go}
      </div>
      <div class="out">${c.outcomes ? `<div class="mono">学完你能</div><ol>${c.outcomes.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>` : `<div class="mono">${L.length} 课 · ${hours(c.minutes)}</div>`}</div>
    </section>
    <section class="plan"><div class="bays">${bays}</div><div class="names">${names}</div></section>
    ${c.units.map((u, ui) => `
    <section class="unit" id="u${ui}">
      <div class="uh"><span class="mono">${pad(ui + 1)}</span><h2>${esc(u.title)}</h2><span class="mono muted">${u.lessons.length} 课 · ${hours(u.lessons.reduce((n, l) => n + (l.minutes || 0), 0))}</span></div>
      <div class="works">${u.lessons.map((l) => {
        const n = L.indexOf(l) + 1, href = c.id === 'mpc' && l.status === 'current' ? `#/lesson/${c.progress.step}` : '#';
        return `<a class="work ${l.status}" href="${href}">
          ${plate(l, { label: `${c.short || ''} · ${pad(n)}` })}
          <div class="label">
            <div class="cat mono"><span>${pad(n)} · ${l.minutes} 分钟</span>${l.status === 'done' ? '<span class="ok">✓ 学过</span>' : ''}</div>
            <div class="t">${esc(l.title)}</div>
            <p>${esc(l.summary)}</p>
            ${l.status === 'current' ? `<span class="resume">继续 · 第 ${c.progress.step} 步 ${ARROW}</span>` : ''}
          </div>
        </a>`;
      }).join('')}</div>
    </section>`).join('')}
  </main>`;
}

// ---------------------------------------------------------------- lesson: the room
let ticker;
function lessonPage(app, step) {
  const c = course('mpc'), L = lesson, at = Math.min(Math.max(+step || L.at, 1), L.steps.length);
  accent(c);
  clearInterval(ticker);
  document.body.classList.remove('playing');
  const s = L.steps[at - 1], page = L.pages[at];
  const nextOpen = [1, 5, 6, 8].find((n) => n > at) || at;
  const next = L.steps[at] ;
  const head = `<div class="step-h"><div class="mono">${pad(at)} / ${L.steps.length} · ${KIND[s.kind]}</div><h2>${esc(s.title)}</h2></div>`;
  const nextRow = next ? `<div class="next"><span class="peek">下一步 · <b>${esc(next.title)}</b></span><a class="btn primary" href="#/lesson/${nextOpen}">继续 ${ARROW}</a></div>` : '';
  const askBox = (asks) => `<div class="ask"><div class="mono"><span>问</span><span>${pad(at)}</span></div>${(asks || []).map((q) => `<span class="q">${q}</span>`).join('')}<div class="line">问这一页……</div></div>`;
  let body;
  if (!page) body = `<div class="room-l text"><article class="read">${head}<p class="muted">（原型只做了第 1、5、6、8 步。）</p>${nextRow}</article><aside class="margin"></aside></div>`;
  else if (s.kind === 'scene') {
    body = `<div class="room-l"><div>${head}
      <figure class="stage" style="margin:0">${plate({ thumb: page.figure }, { full: true })}<div class="aside">${esc(page.caption)}</div>
        <div class="player"><button class="pp" aria-label="播放"><svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z" fill="currentColor"/></svg></button>
          <div class="segs">${page.lines.map((_, i) => `<i><b style="--p:${i < page.line ? 100 : i === page.line ? 40 : 0}%"></b></i>`).join('')}</div>
          <span class="time mono">0:${pad(page.at)} / 0:${pad(page.seconds)}</span>
          <a class="btn primary" href="#/lesson/${nextOpen}">继续 ${ARROW}</a></div>
        <p class="say">${page.lines.map((t, i) => (i === page.line ? esc(t) : '')).join('')}</p>
      </figure></div>
      <aside class="margin">${askBox(page.asks)}</aside></div>`;
  } else if (s.kind === 'check') {
    body = `<div class="room-l text"><article class="quiz">${head}<div class="q">${page.q}</div>
      ${page.options.map((o, i) => `<button class="opt" data-i="${i}"><span class="mono">${'ABCD'[i]}</span><span>${o}</span><span class="verdict"></span></button>`).join('')}
      <div class="why" hidden>${page.explain}</div>${nextRow}</article><aside class="margin">${askBox(['两个计划的平均刹车时刻各是多少？'])}</aside></div>`;
  } else {
    body = `<div class="room-l text"><article class="read">${head}
      ${page.paras.map((p, i) => `<p data-i="${i}">${p}${page.note && page.note.para === i ? '<sup>1</sup>' : ''}</p>`).join('')}
      ${page.aside ? `<div class="aside-note"><span class="mono">另外</span>${page.aside}</div>` : ''}${nextRow}</article>
      <aside class="margin">${askBox(page.asks)}${page.note ? `<div class="note" id="note"><div class="mono">问 · 01</div><div class="q">${esc(page.note.q)}</div><div class="a">${page.note.a}</div></div>` : ''}</aside></div>`;
  }
  app.innerHTML = `
  <header class="l-bar"><div class="wrap">
    <div class="row"><a class="crs" href="#/course/mpc">← ${esc(c.title)}</a><h1>${esc(L.title)}</h1><span class="count mono">${pad(at)} / ${L.steps.length}</span></div>
    <svg class="strip" id="strip"></svg>
  </div></header>
  <main class="wrap">${body}</main>
  <div class="dock"><button class="btn quiet">问</button><a class="btn primary" href="#/lesson/${nextOpen}">继续 ${ARROW}</a></div>`;
  const sv = app.querySelector('#strip');
  strip(sv, L, at);
  sv.querySelectorAll('.s').forEach((g) => g.addEventListener('click', () => (location.hash = `#/lesson/${g.dataset.n}`)));
  addEventListener('scroll', () => app.querySelector('.l-bar')?.classList.toggle('scrolled', scrollY > 4), { passive: true });

  if (s.kind === 'check' && page) {
    app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      app.querySelectorAll('.opt').forEach((o) => {
        const j = +o.dataset.i;
        o.classList.toggle('right', j === page.right && (i === page.right || true));
        o.classList.toggle('wrong', j === i && i !== page.right);
        o.querySelector('.verdict').textContent = j === page.right ? '对' : j === i ? '你的选择' : '';
      });
      app.querySelector('.why').hidden = false;
    }));
  }
  if (s.kind === 'scene' && page) {
    // the room's lights: playing dims all but the exhibit; the subtitle advances line by line
    const pp = app.querySelector('.pp'), say = app.querySelector('.say'), segs = [...app.querySelectorAll('.segs b')];
    let line = page.line, prog = 40;
    const draw = () => {
      segs.forEach((b, i) => b.style.setProperty('--p', `${i < line ? 100 : i === line ? prog : 0}%`));
      say.innerHTML = esc(page.lines[line]);
    };
    pp.addEventListener('click', () => {
      const on = !document.body.classList.contains('playing');
      document.body.classList.toggle('playing', on);
      pp.innerHTML = on ? '<svg viewBox="0 0 14 14"><path d="M3 1h3v12H3zM8 1h3v12H8z" fill="currentColor"/></svg>' : '<svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z" fill="currentColor"/></svg>';
      clearInterval(ticker);
      if (on) ticker = setInterval(() => {
        prog += 4;
        if (prog >= 100) { prog = 0; line = (line + 1) % page.lines.length; }
        draw();
      }, 160);
    });
  }
  // the note sits beside the paragraph it answers; a fine leader joins them
  const note = app.querySelector('#note');
  if (note && innerWidth > 1100) requestAnimationFrame(() => {
    const p = app.querySelector(`.read p[data-i="${page.note.para}"]`), margin = app.querySelector('.margin');
    const mb = margin.getBoundingClientRect(), pb = p.getBoundingClientRect();
    note.style.top = `${pb.top - mb.top}px`;
    const sup = p.querySelector('sup').getBoundingClientRect();
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.classList.add('leader');
    const y = sup.top - mb.top + 6;
    svg.innerHTML = `<path d="M${sup.right - mb.left + 6},${y}H${-14}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="1.5 4" fill="none"/><circle cx="-14" cy="${y}" r="2.2" fill="var(--accent)"/>`;
    margin.append(svg);
  });
}

UI.switcher('exhibit');
UI.start((r, ctx) => {
  const app = document.getElementById('app');
  if (r.page === 'course') coursePage(app, r.id);
  else if (r.page === 'lesson') {
    lessonPage(app, r.id);
    if (ctx.from?.page === 'lesson') app.querySelectorAll('.room-l').forEach((el) => UI.step_in(el, +(ctx.from.id || lesson.at), +(r.id || lesson.at)));
  }
  else home(app);
});
</script>
</body>
</html>
